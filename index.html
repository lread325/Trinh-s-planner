                              style={{
                                display: "flex",
                                alignItems: "center",
                                gap: 10,
                                padding: "11px 13px",
                                cursor: "pointer",
                              }}
                            >
                              <div
                                style={{
                                  width: 20,
                                  height: 20,
                                  borderRadius: 5,
                                  border: `1.5px solid ${checked ? C.herb : C.line}`,
                                  background: checked ? C.herb : "transparent",
                                  display: "flex",
                                  alignItems: "center",
                                  justifyContent: "center",
                                  flexShrink: 0,
                                }}
                              >
                                {checked && <IconCheck size={13} color="#fff" />}
                              </div>
                              <span style={{ fontSize: 14.5, color: checked ? C.inkSoft : C.ink, textDecoration: checked ? "line-through" : "none" }}>
                                {item.hasQty ? `${formatQty(item.qty)} ${item.unit} ` : ""}
                                {item.name}
                                {item.pantryAdjusted && (
                                  <span style={{ fontSize: 12, color: C.inkSoft, fontStyle: "italic" }}> · have some in pantry</span>
                                )}
                              </span>
                            </div>
                          </SwipeableRow>
                        </div>
                      );
                    })}
                  </div>
                </div>
              ))
            )}
          </div>
        )}

        {tab === "pantry" && (
          <div>
            <p style={{ fontSize: 13.5, color: C.inkSoft, marginTop: 0, marginBottom: 12 }}>
              What you already have on hand. Anything listed here gets subtracted from your weekly grocery list. Swipe left on an item to remove it.
            </p>
            <div style={{ display: "flex", gap: 6, marginBottom: 16 }}>
              <input
                style={{
                  flex: 1,
                  minWidth: 0,
                  fontFamily: sans,
                  fontSize: 15,
                  padding: "10px 12px",
                  borderRadius: 10,
                  border: `1px solid ${C.line}`,
                  background: "#fff",
                  color: C.ink,
                  boxSizing: "border-box",
                }}
                placeholder="e.g. 2 cups flour, or just olive oil"
                value={pantryInput}
                onChange={(e) => setPantryInput(e.target.value)}
                onKeyDown={(e) => {
                  if (e.key === "Enter") {
                    addPantryItem(pantryInput);
                    setPantryInput("");
                  }
                }}
              />
              <Btn
                variant="primary"
                onClick={() => {
                  addPantryItem(pantryInput);
                  setPantryInput("");
                }}
              >
                Add
              </Btn>
            </div>

            <QuickAddChips
              pool={allKnownItems}
              query={pantryInput}
              onPick={(name) => {
                addPantryItem(name);
                setPantryInput("");
              }}
            />

            {pantryUndo.length > 0 && (
              <div style={{ marginBottom: 16 }}>
                <p style={{ fontSize: 12, fontWeight: 600, color: C.inkSoft, textTransform: "uppercase", letterSpacing: 0.4, margin: "0 0 6px" }}>
                  Recently removed
                </p>
                <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                  {pantryUndo.map((entry) => (
                    <button
                      key={entry.id}
                      onClick={() => undoPantryRemove(entry.id)}
                      style={{
                        display: "flex",
                        alignItems: "center",
                        gap: 6,
                        background: C.card,
                        border: "none",
                        boxShadow: "0 1px 2px rgba(74,54,38,0.1)",
                        borderRadius: 999,
                        padding: "6px 11px",
                        fontFamily: sans,
                        fontSize: 12.5,
                        color: C.herbDeep,
                        cursor: "pointer",
                      }}
                    >
                      <IconUndo size={13} color={C.herbDeep} /> {entry.label}
                    </button>
                  ))}
                </div>
              </div>
            )}

            {pantry.length === 0 ? (
              <div style={{ textAlign: "center", padding: "30px 16px", border: `1px dashed ${C.line}`, borderRadius: 12 }}>
                <div style={{ display: "inline-block", animation: "bearBob 2.4s ease-in-out infinite" }}>
                  <BearIllustration width={64} />
                </div>
                <p style={{ fontSize: 14, color: C.inkSoft, marginTop: 10, marginBottom: 0 }}>
                  Your pantry is empty. Add staples you already have so they're skipped on your grocery list.
                </p>
              </div>
            ) : (
              pantryGroups.map((group) => (
                <div key={group.cat} style={{ marginBottom: 16 }}>
                  <h4 style={{ fontFamily: sans, fontSize: 12.5, fontWeight: 600, color: C.herbDeep, textTransform: "uppercase", letterSpacing: 0.4, margin: "0 0 6px" }}>
                    {group.cat}
                  </h4>
                  <div style={{ background: C.card, boxShadow: "0 1px 3px rgba(74,54,38,0.08)", borderRadius: 14, overflow: "hidden" }}>
                    {group.items.map((item, idx) => {
                      const qtyNum = parseQty(String(item.qty));
                      const hasQty = !isNaN(qtyNum) && String(item.qty).trim() !== "";
                      const isVanishing = vanishingPantryIds.includes(item.id);
                      return (
                        <div
                          key={item.id}
                          style={{ borderBottom: idx < group.items.length - 1 ? `1px solid ${C.paperDim}` : "none" }}
                        >
                          <SwipeableRow onDelete={() => requestDelete("pantry", item.id, item.name)}>
                            <div
                              style={{
                                display: "flex",
                                alignItems: "center",
                                gap: 10,
                                padding: "10px 13px",
                                opacity: isVanishing ? 0 : 1,
                                transform: isVanishing ? "scale(0.85)" : "scale(1)",
                                transition: "opacity .25s ease-out, transform .25s ease-out",
                                pointerEvents: isVanishing ? "none" : "auto",
                              }}
                            >
                              <span style={{ fontSize: 14.5, color: C.ink, flex: 1, minWidth: 0 }}>
                                {item.name}
                                {!hasQty && <span style={{ fontSize: 12, color: C.inkSoft, marginLeft: 6 }}>in stock</span>}
                              </span>
                              {hasQty && (
                                <button
                                  className="stepper-btn"
                                  onClick={() => adjustPantryQty(item.id, -1)}
                                  aria-label="Decrease"
                                  style={{ width: 26, height: 26, borderRadius: "50%", background: C.paperDim, border: "none", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}
                                >
                                  <IconMinus size={14} color={C.herbDeep} />
                                </button>
                              )}
                              {hasQty && (
                                <span style={{ fontSize: 13.5, color: C.ink, minWidth: 44, textAlign: "center", flexShrink: 0 }}>
                                  {formatQty(qtyNum)} {item.unit}
                                </span>
                              )}
                              <button
                                className="stepper-btn"
                                onClick={() => adjustPantryQty(item.id, 1)}
                                aria-label="Increase"
                                style={{ width: 26, height: 26, borderRadius: "50%", background: C.paperDim, border: "none", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}
                              >
                                <IconPlus size={14} color={C.herbDeep} />
                              </button>
                            </div>
                          </SwipeableRow>
                        </div>
                      );
                    })}
                  </div>
                </div>
              ))
            )}
          </div>
        )}
      </div>
      )}

      {formOpen && (
        <RecipeForm
          initial={editingRecipe}
          onSave={saveRecipe}
          onCancel={() => { setFormOpen(false); setEditingRecipe(null); }}
          folders={folders}
          onManageFolders={() => setFolderModalOpen(true)}
        />
      )}
      {viewingRecipe && (
        <RecipeDetail
          recipe={viewingRecipe}
          onClose={() => setViewingRecipe(null)}
          pantry={pantry}
          onTogglePantry={togglePantryIngredient}
        />
      )}
      {folderModalOpen && (
        <FolderModal
          folders={folders}
          onSave={saveFolder}
          onDelete={(id) => requestDelete("folder", id, folders.find((f) => f.id === id)?.name || "this folder")}
          onClose={() => setFolderModalOpen(false)}
        />
      )}
      {confirmTarget && (
        <ConfirmModal
          message={`Delete "${confirmTarget.label}"? This can't be undone.`}
          onConfirm={confirmDelete}
          onCancel={() => setConfirmTarget(null)}
        />
      )}
      {importPreview && (
        <ImportPreviewModal
          data={importPreview}
          error={importError}
          onMerge={applyImportMerge}
          onReplace={applyImportReplace}
          onCancel={() => { setImportPreview(null); setImportError(""); }}
        />
      )}
      {addToDayTarget && (
        <AddToDayModal
          date={addToDayTarget.date}
          mealId={addToDayTarget.mealId}
          availableRecipes={recipes.slice().sort((a, b) => a.name.localeCompare(b.name))}
          onAdd={(id) => addToDay(addToDayTarget.date, addToDayTarget.mealId, id)}
          onClose={() => setAddToDayTarget(null)}
        />
      )}

      {view === "main" && (
      <div
        style={{
          position: "fixed",
          bottom: 0,
          left: "50%",
          transform: "translateX(-50%)",
          width: "100%",
          maxWidth: 480,
          background: C.card,
          boxShadow: "0 -2px 12px rgba(74,54,38,0.1)",
          display: "flex",
          padding: "8px 4px 10px",
        }}
      >
        {tabs.map((t) => {
          const Icon = t.icon;
          const active = tab === t.id;
          return (
            <button
              key={t.id}
              onClick={() => setTab(t.id)}
              style={{
                flex: 1,
                background: "none",
                border: "none",
                cursor: "pointer",
                display: "flex",
                flexDirection: "column",
                alignItems: "center",
                gap: 4,
                padding: "4px 0",
              }}
            >
              <div
                style={{
                  width: 44,
                  height: 26,
                  borderRadius: 999,
                  background: active ? C.paperDim : "transparent",
                  display: "flex",
                  alignItems: "center",
                  justifyContent: "center",
                }}
              >
                <Icon size={20} color={active ? C.herbDeep : C.inkSoft} />
              </div>
              <span style={{ fontSize: 11, fontFamily: sans, color: active ? C.herbDeep : C.inkSoft, fontWeight: active ? 600 : 400 }}>
                {t.label}
              </span>
            </button>
          );
        })}
      </div>
      )}
    </div>
  );
}

function WeekNav({ weekStart, setWeekStart }) {
  return (
    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 14 }}>
      <button onClick={() => setWeekStart(addDays(weekStart, -7))} style={navBtnStyle}>
        ‹
      </button>
      <span style={{ fontFamily: serif, fontSize: 15, fontWeight: 600, color: C.ink }}>
        {fmtDate(weekStart)} – {fmtDate(addDays(weekStart, 6))}
      </span>
      <button onClick={() => setWeekStart(addDays(weekStart, 7))} style={navBtnStyle}>
        ›
      </button>
    </div>
  );
}
const navBtnStyle = {
  background: C.card,
  border: "none",
  boxShadow: "0 1px 3px rgba(74,54,38,0.1)",
  borderRadius: "50%",
  width: 34,
  height: 34,
  cursor: "pointer",
  fontSize: 18,
  color: C.ink,
  lineHeight: 1,
};

function EmptyState({ text }) {
  return (
    <div style={{ textAlign: "center", padding: "36px 16px", color: C.inkSoft, fontSize: 14, border: `1px dashed ${C.line}`, borderRadius: 12 }}>
      {text}
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<MealPlanner />);
</script>
</body>
</html>
