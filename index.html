// ---------- date helpers ----------
function toISO(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
function addDays(d, n) {
  const nd = new Date(d);
  nd.setDate(nd.getDate() + n);
  return nd;
}
function getMonday(d) {
  const nd = new Date(d);
  const day = nd.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  nd.setDate(nd.getDate() + diff);
  nd.setHours(0, 0, 0, 0);
  return nd;
}
function fmtDay(d) {
  return d.toLocaleDateString(undefined, { weekday: "short" });
}
function fmtDate(d) {
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}
function uid() {
  return Math.random().toString(36).slice(2, 10);
}

// ---------- quantity helpers (support fractions like "1 1/2", "3/4") ----------
function parseQty(str) {
  if (!str) return NaN;
  const parts = String(str).trim().split(/\s+/);
  let total = 0;
  let found = false;
  for (const p of parts) {
    if (p.includes("/")) {
      const [n, d] = p.split("/").map(Number);
      if (d) {
        total += n / d;
        found = true;
      }
    } else {
      const v = parseFloat(p);
      if (!isNaN(v)) {
        total += v;
        found = true;
      }
    }
  }
  return found ? total : NaN;
}
const NICE_FRACTIONS = [
  [0, ""], [0.125, "\u215b"], [0.25, "\u00bc"], [0.333, "\u2153"], [0.375, "\u215c"],
  [0.5, "\u00bd"], [0.625, "\u215d"], [0.667, "\u2154"], [0.75, "\u00be"], [0.875, "\u215e"], [1, ""],
];
function formatQty(n) {
  if (n == null || isNaN(n)) return "";
  const rounded = Math.round(n * 1000) / 1000;
  let whole = Math.floor(rounded);
  const frac = rounded - whole;
  let best = NICE_FRACTIONS[0];
  let bestDiff = Infinity;
  for (const pair of NICE_FRACTIONS) {
    const diff = Math.abs(frac - pair[0]);
    if (diff < bestDiff) {
      bestDiff = diff;
      best = pair;
    }
  }
  let symbol = best[1];
  if (best[0] === 1) {
    whole += 1;
    symbol = "";
  }
  if (whole === 0 && symbol) return symbol;
  if (symbol) return `${whole} ${symbol}`;
  return `${whole}`;
}

// ---------- storage helpers (plain browser localStorage - private to this device) ----------
const STORAGE_PREFIX = "trinhs-planner:";
async function loadKey(key, fallback) {
  try {
    const raw = localStorage.getItem(STORAGE_PREFIX + key);
    return raw != null ? JSON.parse(raw) : fallback;
  } catch (e) {
    return fallback;
  }
}
async function saveKey(key, value) {
  try {
    localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(value));
  } catch (e) {
    console.error("storage save failed", key, e);
  }
}

// ---------- migration helpers ----------
function migrateRecipe(r) {
  return {
    ...r,
    folderId: r.folderId || null,
    ingredients: (r.ingredients || []).map((i) => ({ ...i, category: i.category || "Other" })),
  };
}
function groupByFolder(list, folders) {
  const byId = {};
  folders.forEach((f) => {
    byId[f.id] = { folder: f, recipes: [] };
  });
  const unfiled = { folder: null, recipes: [] };
  list.forEach((r) => {
    if (r.folderId && byId[r.folderId]) byId[r.folderId].recipes.push(r);
    else unfiled.recipes.push(r);
  });
  const groups = folders.map((f) => byId[f.id]);
  groups.push(unfiled);
  return groups;
}
function migrateDayEntry(entry) {
  if (Array.isArray(entry)) {
    return { breakfast: [], lunch: [], dinner: entry };
  }
  return { breakfast: entry?.breakfast || [], lunch: entry?.lunch || [], dinner: entry?.dinner || [] };
}

// ---------- ingredient text / recipe-site import helpers ----------
const FRACTION_MAP = {
  "¼": "1/4", "½": "1/2", "¾": "3/4", "⅓": "1/3", "⅔": "2/3",
  "⅕": "1/5", "⅖": "2/5", "⅗": "3/5", "⅘": "4/5",
  "⅙": "1/6", "⅚": "5/6", "⅛": "1/8", "⅜": "3/8", "⅝": "5/8", "⅞": "7/8",
};
const UNIT_ALIASES = {
  cups: "cup", cup: "cup", c: "cup",
  tablespoons: "tbsp", tablespoon: "tbsp", tbsp: "tbsp", tbsps: "tbsp",
  teaspoons: "tsp", teaspoon: "tsp", tsp: "tsp", tsps: "tsp",
  ounces: "oz", ounce: "oz", oz: "oz",
  pounds: "lb", pound: "lb", lbs: "lb", lb: "lb",
  grams: "g", gram: "g", g: "g",
  kilograms: "kg", kilogram: "kg", kg: "kg",
  milliliters: "ml", milliliter: "ml", ml: "ml",
  liters: "l", liter: "l", l: "l",
  cloves: "clove", clove: "clove",
  cans: "can", can: "can",
  pinches: "pinch", pinch: "pinch",
  whole: "whole",
};
const UNIT_REGEX = new RegExp("^(" + Object.keys(UNIT_ALIASES).sort((a, b) => b.length - a.length).join("|") + ")\\b\\.?", "i");

function decodeHtmlEntities(str) {
  const el = document.createElement("textarea");
  el.innerHTML = str;
  return el.value;
}

function parseIngredientLine(rawLine) {
  let line = String(rawLine || "").trim().replace(/^[•\-*–\u2022]\s*/, "");
  Object.entries(FRACTION_MAP).forEach(([sym, frac]) => {
    line = line.split(sym).join(" " + frac + " ");
  });
  line = line.replace(/\s+/g, " ").trim();

  let qty = "";
  const qtyMatch = line.match(/^(\d+\s+\d+\/\d+|\d+\/\d+|\d+(\.\d+)?)/);
  let rest = line;
  if (qtyMatch) {
    qty = qtyMatch[0].trim();
    rest = line.slice(qtyMatch[0].length).trim();
  }

  let unit = "";
  const unitMatch = rest.match(UNIT_REGEX);
  if (unitMatch) {
    unit = UNIT_ALIASES[unitMatch[1].toLowerCase()] || "";
    rest = rest.slice(unitMatch[0].length).trim().replace(/^of\s+/i, "");
  }

  return { qty, unit, name: rest };
}

function parseIngredientText(text) {
  return text
    .split("\n")
    .map((l) => l.trim())
    .filter(Boolean)
    .map(parseIngredientLine);
}

function guessCategory(name) {
  const n = (name || "").toLowerCase();
  const rules = [
    [/paper towel|dish soap|aluminum foil|foil\b|plastic wrap|parchment|trash bag|dishwasher|sponge|napkin|ziploc|detergent/, "Household"],
    [/chicken|beef|pork|turkey|bacon|sausage|shrimp|salmon|fish|steak|lamb|ham\b/, "Meat & seafood"],
    [/milk|cheese|butter|\begg|eggs\b|yogurt|cream/, "Dairy & eggs"],
    [/onion|garlic|tomato|pepper|lettuce|carrot|potato|lemon|lime|spinach|basil|cilantro|parsley|herb|cucumber|zucchini|mushroom|avocado|apple|banana|celery|ginger/, "Produce"],
    [/frozen|ice cream/, "Frozen"],
    [/flour|sugar|salt|\boil\b|rice|pasta|broth|stock|vinegar|beans|lentil|honey|syrup|baking (soda|powder)|peanut butter|cereal|\boats\b|ketchup|mustard|mayonnaise/, "Pantry"],
    [/bread|bun|tortilla|bagel|roll\b/, "Bakery"],
    [/cinnamon|cumin|paprika|oregano|thyme|chili flakes|chili powder|spice|vanilla|nutmeg|clove\b/, "Spices & condiments"],
    [/wine|beer|juice|soda|sparkling water|\bcoffee\b|\btea\b/, "Beverages"],
  ];
  for (const [re, cat] of rules) {
    if (re.test(n)) return cat;
  }
  return "Other";
}

function extractJsonLdRecipe(html) {
  const scriptRegex = /<script[^>]+type=["']application\/ld\+json["'][^>]*>([\s\S]*?)<\/script>/gi;
  const roots = [];
  let m;
  while ((m = scriptRegex.exec(html))) {
    try {
      roots.push(JSON.parse(m[1].trim()));
    } catch (e) {
      // some pages emit slightly malformed JSON-LD - skip it
    }
  }
  function* walk(node) {
    if (Array.isArray(node)) {
      for (const n of node) yield* walk(n);
    } else if (node && typeof node === "object") {
      yield node;
      if (node["@graph"]) yield* walk(node["@graph"]);
    }
  }
  for (const root of roots) {
    for (const node of walk(root)) {
      const type = node["@type"];
      const isRecipe = type === "Recipe" || (Array.isArray(type) && type.includes("Recipe"));
      if (isRecipe) return node;
    }
  }
  return null;
}

function jsonLdToRecipeDraft(node) {
  const name = decodeHtmlEntities(String(node.name || "")).trim();
  let servings = "";
  if (node.recipeYield) {
    const y = Array.isArray(node.recipeYield) ? node.recipeYield[0] : node.recipeYield;
    const found = String(y).match(/\d+/);
    if (found) servings = found[0];
  }
  let instructionsText = "";
  if (Array.isArray(node.recipeInstructions)) {
    instructionsText = node.recipeInstructions
      .map((step) => {
        if (typeof step === "string") return step;
        if (step && step.text) return step.text;
        if (step && Array.isArray(step.itemListElement)) {
          return step.itemListElement.map((s) => (typeof s === "string" ? s : s.text || "")).join("\n");
        }
        return "";
      })
      .filter(Boolean)
      .map(decodeHtmlEntities)
      .join("\n");
  } else if (typeof node.recipeInstructions === "string") {
    instructionsText = decodeHtmlEntities(node.recipeInstructions);
  }
  const rawIngredients = Array.isArray(node.recipeIngredient)
    ? node.recipeIngredient
    : Array.isArray(node.ingredients)
    ? node.ingredients
    : [];
  const ingredients = rawIngredients.map((line) => parseIngredientLine(decodeHtmlEntities(String(line))));
  return { name, servings, instructions: instructionsText.trim(), ingredients };
}

const CORS_PROXIES = [
  { name: "codetabs", build: (url) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}` },
  { name: "allorigins", build: (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}` },
  { name: "cors.lol", build: (url) => `https://api.cors.lol/url=${encodeURIComponent(url)}` },
];
async function fetchHtmlViaProxy(url) {
  const attempts = [];
  for (const proxy of CORS_PROXIES) {
    try {
      const res = await fetch(proxy.build(url));
      if (!res.ok) {
        attempts.push(`${proxy.name}: HTTP ${res.status}`);
        continue;
      }
      const text = await res.text();
      if (text && text.length > 200) return text;
      attempts.push(`${proxy.name}: empty response`);
    } catch (e) {
      attempts.push(`${proxy.name}: ${e.message || "network error"}`);
    }
  }
  const err = new Error("fetch-failed");
  err.detail = attempts.join(" | ");
  throw err;
}
async function importRecipeFromUrl(url) {
  const html = await fetchHtmlViaProxy(url);
  const node = extractJsonLdRecipe(html);
  if (!node) {
    const err = new Error("no-recipe-data");
    throw err;
  }
  return jsonLdToRecipeDraft(node);
}

function BearIllustration({ width = 150 }) {
  const [blinking, setBlinking] = useState(false);
  useEffect(() => {
    let closeTimeout;
    let scheduleTimeout;
    function scheduleBlink() {
      const delay = 10000 + Math.random() * 5000;
      scheduleTimeout = setTimeout(() => {
        setBlinking(true);
        closeTimeout = setTimeout(() => setBlinking(false), 140);
        scheduleBlink();
      }, delay);
    }
    scheduleBlink();
    return () => {
      clearTimeout(scheduleTimeout);
      clearTimeout(closeTimeout);
    };
  }, []);

  const eyeStyle = (cx, cy) => ({
    transformOrigin: `${cx}px ${cy}px`,
    transform: blinking ? "scaleY(0.12)" : "scaleY(1)",
    transition: "transform .1s ease-in-out",
  });

  return (
    <svg width={width} height={width} viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <circle cx="46" cy="56" r="26" fill={C.bearFur} stroke={C.herbDeep} strokeWidth="3" />
      <circle cx="154" cy="56" r="26" fill={C.bearFur} stroke={C.herbDeep} strokeWidth="3" />
      <circle cx="46" cy="57" r="11" fill={C.bearFurLight} />
      <circle cx="154" cy="57" r="11" fill={C.bearFurLight} />
      <circle cx="100" cy="108" r="72" fill={C.bearFur} stroke={C.herbDeep} strokeWidth="3" />
      <circle cx="72" cy="102" r="6" fill={C.herbDeep} style={eyeStyle(72, 102)} />
      <circle cx="128" cy="102" r="6" fill={C.herbDeep} style={eyeStyle(128, 102)} />
      <circle cx="60" cy="122" r="9" fill={C.bearBlush} opacity="0.7" />
      <circle cx="140" cy="122" r="9" fill={C.bearBlush} opacity="0.7" />
      <ellipse cx="100" cy="128" rx="20" ry="14" fill={C.bearMuzzle} />
      <ellipse cx="100" cy="122" rx="6" ry="4.5" fill={C.herbDeep} />
    </svg>
  );
}

function Btn({ children, onClick, variant = "ghost", style, ...rest }) {
  const base = {
    fontFamily: sans,
    fontSize: 14,
    fontWeight: 500,
    padding: "10px 16px",
    borderRadius: 999,
    cursor: "pointer",
    border: "none",
    display: "inline-flex",
    alignItems: "center",
    gap: 6,
    transition: "opacity .12s",
  };
  const variants = {
    primary: { background: C.herb, color: "#fff", boxShadow: "0 2px 8px rgba(107,70,38,0.28)" },
    tomato: { background: C.tomato, color: "#fff", boxShadow: "0 2px 8px rgba(154,51,31,0.25)" },
    ghost: { background: C.paperDim, color: C.ink },
    quiet: { background: "transparent", color: C.inkSoft, padding: "6px 4px" },
  };
  return (
    <button
      onClick={onClick}
      style={{ ...base, ...variants[variant], ...style }}
      onMouseDown={(e) => (e.currentTarget.style.opacity = "0.75")}
      onMouseUp={(e) => (e.currentTarget.style.opacity = "1")}
      {...rest}
    >
      {children}
    </button>
  );
}

// ---------- Recipe Form ----------
function RecipeForm({ initial, onSave, onCancel, folders, onManageFolders }) {
  const [name, setName] = useState(initial?.name || "");
  const [servings, setServings] = useState(initial?.servings || 4);
  const [folderId, setFolderId] = useState(initial?.folderId || "");
  const [instructions, setInstructions] = useState(initial?.instructions || "");
  const [ingredients, setIngredients] = useState(
    initial?.ingredients?.length ? initial.ingredients : [{ id: uid(), name: "", qty: "", unit: "", category: "Other" }]
  );
  const [error, setError] = useState("");
  const [importUrl, setImportUrl] = useState("");
  const [importState, setImportState] = useState({ status: "idle", message: "" });
  const [showPaste, setShowPaste] = useState(false);
  const [pasteText, setPasteText] = useState("");

  async function handleFetchUrl() {
    if (!importUrl.trim()) return;
    setImportState({ status: "loading", message: "Fetching recipe…" });
    try {
      const draft = await importRecipeFromUrl(importUrl.trim());
      if (draft.name) setName(draft.name);
      if (draft.servings) setServings(draft.servings);
      if (draft.instructions) setInstructions(draft.instructions);
      if (draft.ingredients.length) {
        setIngredients(
          draft.ingredients.map((i) => ({ id: uid(), name: i.name, qty: i.qty, unit: i.unit, category: guessCategory(i.name) }))
        );
      }
      setImportState({
        status: "success",
        message: `Imported ${draft.ingredients.length} ingredients — double-check quantities and units before saving.`,
      });
    } catch (e) {
      console.error("Recipe import failed:", e, e.detail || "");
      let message;
      if (e.message === "no-recipe-data") {
        message = "Fetched that page, but couldn't find recipe data on it. This site may not publish it in a readable format. Try pasting the ingredients below instead.";
      } else if (e.message === "fetch-failed") {
        message = "Couldn't reach that page right now (the fetch service may be down or blocked). Try again in a moment, or paste the ingredients below instead.";
      } else {
        message = "Couldn't import automatically from that link. Try pasting the ingredients below instead.";
      }
      setImportState({ status: "error", message });
    }
  }

  function handlePasteParse() {
    const parsed = parseIngredientText(pasteText).map((p) => ({
      id: uid(),
      name: p.name,
      qty: p.qty,
      unit: p.unit,
      category: guessCategory(p.name),
    }));
    if (!parsed.length) return;
    setIngredients((prev) => {
      const isBlankDefault = prev.length === 1 && !prev[0].name;
      return isBlankDefault ? parsed : [...prev, ...parsed];
    });
    setPasteText("");
    setShowPaste(false);
  }

  function updateIng(id, field, value) {
    setIngredients((prev) => prev.map((ing) => (ing.id === id ? { ...ing, [field]: value } : ing)));
  }
  function addIng() {
    setIngredients((prev) => [...prev, { id: uid(), name: "", qty: "", unit: "", category: "Other" }]);
  }
  function removeIng(id) {
    setIngredients((prev) => prev.filter((ing) => ing.id !== id));
  }

  function handleSave() {
    if (!name.trim()) {
      setError("Give the recipe a name first.");
      return;
    }
    const cleanIngredients = ingredients
      .map((i) => ({ ...i, name: i.name.trim() }))
      .filter((i) => i.name);
    onSave({
      id: initial?.id || uid(),
      name: name.trim(),
      servings: Number(servings) || 1,
      folderId: folderId || null,
      instructions: instructions.trim(),
      ingredients: cleanIngredients,
    });
  }

  const labelStyle = { fontSize: 13, fontWeight: 500, color: C.inkSoft, marginBottom: 5, display: "block" };
  const inputStyle = {
    fontFamily: sans,
    fontSize: 15,
    padding: "9px 10px",
    borderRadius: 7,
    border: `1px solid ${C.line}`,
    background: "#fff",
    color: C.ink,
    boxSizing: "border-box",
  };

  return (
    <div
      style={{
        position: "fixed",
        inset: 0,
        background: "rgba(35,48,61,0.45)",
        display: "flex",
        alignItems: "flex-end",
        justifyContent: "center",
        zIndex: 50,
        animation: "fadeIn .15s ease-out",
      }}
      onClick={onCancel}
    >
      <div
        onClick={(e) => e.stopPropagation()}
        style={{
          background: C.paper,
          width: "100%",
          maxWidth: 480,
          maxHeight: "88vh",
          overflowY: "auto",
          borderRadius: "20px 20px 0 0",
          padding: "18px 18px 28px",
          boxSizing: "border-box",
          boxShadow: "0 -4px 24px rgba(74,54,38,0.18)",
          animation: "slideUp .22s cubic-bezier(.2,.8,.2,1)",
        }}
      >
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
          <h2 style={{ fontFamily: serif, fontSize: 20, fontWeight: 600, color: C.ink, margin: 0 }}>
            {initial ? "Edit recipe" : "New recipe"}
          </h2>
          <button onClick={onCancel} style={{ background: "none", border: "none", cursor: "pointer", padding: 4 }}>
            <IconX color={C.inkSoft} />
          </button>
        </div>

        <div
          style={{
            background: C.paperDim,
            borderRadius: 12,
            padding: 12,
            marginBottom: 16,
          }}
        >
          <p style={{ fontSize: 12.5, fontWeight: 600, color: C.herbDeep, textTransform: "uppercase", letterSpacing: 0.4, margin: "0 0 8px" }}>
            Import a recipe
          </p>
          <div style={{ display: "flex", gap: 6 }}>
            <input
              style={{ ...inputStyle, flex: 1, minWidth: 0, background: "#fff" }}
              placeholder="Paste a recipe link"
              value={importUrl}
              onChange={(e) => setImportUrl(e.target.value)}
            />
            <Btn
              variant="primary"
              onClick={handleFetchUrl}
              disabled={importState.status === "loading"}
              style={{ padding: "9px 14px", opacity: importState.status === "loading" ? 0.6 : 1 }}
            >
              {importState.status === "loading" ? "Fetching…" : "Fetch"}
            </Btn>
          </div>
          {importState.message && (
            <p
              style={{
                fontSize: 12.5,
                margin: "8px 0 0",
                color: importState.status === "error" ? C.tomatoDeep : importState.status === "success" ? C.herbDeep : C.inkSoft,
              }}
            >
              {importState.message}
            </p>
          )}
          <button
            onClick={() => setShowPaste((v) => !v)}
            style={{ background: "none", border: "none", cursor: "pointer", padding: 0, marginTop: 9, fontSize: 12.5, color: C.herbDeep, fontFamily: sans, textDecoration: "underline" }}
          >
            {showPaste ? "Hide paste box" : "Or paste ingredients instead"}
          </button>
          {showPaste && (
            <div style={{ marginTop: 8 }}>
              <textarea
                style={{ ...inputStyle, width: "100%", minHeight: 80, resize: "vertical", background: "#fff", fontFamily: sans }}
                placeholder={"Paste ingredient lines, one per line:\n2 cups flour\n1/2 tsp salt\n3 eggs"}
                value={pasteText}
                onChange={(e) => setPasteText(e.target.value)}
              />
              <Btn variant="ghost" onClick={handlePasteParse} style={{ marginTop: 6 }}>
                Add parsed ingredients
              </Btn>
            </div>
          )}
        </div>

        <label style={labelStyle}>Recipe name</label>
        <input
          style={{ ...inputStyle, width: "100%", marginBottom: 12 }}
          value={name}
          onChange={(e) => setName(e.target.value)}
          placeholder="Weeknight tomato pasta"
        />

        <label style={labelStyle}>Servings</label>
        <input
          type="number"
          min="1"
          style={{ ...inputStyle, marginBottom: 14, width: 90 }}
          value={servings}
          onChange={(e) => setServings(e.target.value)}
        />

        <label style={labelStyle}>Folder</label>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 14 }}>
          <select style={{ ...inputStyle, flex: 1 }} value={folderId} onChange={(e) => setFolderId(e.target.value)}>
            <option value="">No folder</option>
            {folders.map((f) => (
              <option key={f.id} value={f.id}>
                {f.name}
              </option>
            ))}
          </select>
          <button
            onClick={onManageFolders}
            style={{ background: "none", border: "none", cursor: "pointer", padding: 0, fontSize: 12.5, color: C.herbDeep, fontFamily: sans, textDecoration: "underline", whiteSpace: "nowrap" }}
          >
            Manage
          </button>
        </div>

        <label style={labelStyle}>Ingredients</label>
        <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 8 }}>
          {ingredients.map((ing) => (
            <div key={ing.id} style={{ paddingBottom: 10, borderBottom: `1px solid ${C.line}` }}>
              <div style={{ display: "flex", gap: 6, alignItems: "center", marginBottom: 6 }}>
                <input
                  style={{ ...inputStyle, flex: 1, minWidth: 0 }}
                  placeholder="Ingredient (e.g. flour)"
                  value={ing.name}
                  onChange={(e) => updateIng(ing.id, "name", e.target.value)}
                />
                <button
                  onClick={() => removeIng(ing.id)}
                  style={{ background: "none", border: "none", cursor: "pointer", padding: 4, flexShrink: 0 }}
                  aria-label="Remove ingredient"
                >
                  <IconX size={16} color={C.inkSoft} />
                </button>
              </div>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                <input
                  style={{ ...inputStyle, flex: "1 1 70px", minWidth: 70 }}
                  placeholder="Qty (e.g. 1 1/2)"
                  value={ing.qty}
                  onChange={(e) => updateIng(ing.id, "qty", e.target.value)}
                />
                <select
                  style={{ ...inputStyle, flex: "1 1 85px", minWidth: 85 }}
                  value={ing.unit}
                  onChange={(e) => updateIng(ing.id, "unit", e.target.value)}
                >
                  {UNITS.map((u) => (
                    <option key={u} value={u}>
                      {u || "unit"}
                    </option>
                  ))}
                </select>
                <select
                  style={{ ...inputStyle, flex: "1 1 130px", minWidth: 130 }}
                  value={ing.category || "Other"}
                  onChange={(e) => updateIng(ing.id, "category", e.target.value)}
                >
                  {CATEGORIES.map((c) => (
                    <option key={c} value={c}>
                      {c}
                    </option>
                  ))}
                </select>
              </div>
            </div>
          ))}
        </div>
        <Btn variant="quiet" onClick={addIng} style={{ marginBottom: 16, padding: "6px 8px" }}>
          <IconPlus size={16} color={C.herb} /> Add ingredient
        </Btn>

        <label style={labelStyle}>Instructions</label>
        <textarea
          style={{ ...inputStyle, width: "100%", minHeight: 100, resize: "vertical", marginBottom: 6, fontFamily: sans }}
          value={instructions}
          onChange={(e) => setInstructions(e.target.value)}
          placeholder="Steps to cook this dish..."
        />

        {error && <p style={{ color: C.tomatoDeep, fontSize: 13, margin: "8px 0 0" }}>{error}</p>}

        <div style={{ display: "flex", gap: 10, marginTop: 18 }}>
          <Btn variant="primary" onClick={handleSave} style={{ flex: 1, justifyContent: "center" }}>
            Save recipe
          </Btn>
          <Btn variant="ghost" onClick={onCancel} style={{ flex: 1, justifyContent: "center" }}>
            Cancel
          </Btn>
        </div>
      </div>
    </div>
  );
}

// ---------- Folder manager modal ----------
function FolderModal({ folders, onSave, onDelete, onClose }) {
  const [editingId, setEditingId] = useState(null); // null = list view, "new" or a folder id = form view
  const [draftName, setDraftName] = useState("");
  const [draftColor, setDraftColor] = useState(FOLDER_COLORS[0]);

  function openNew() {
    setEditingId("new");
    setDraftName("");
    setDraftColor(FOLDER_COLORS[0]);
  }
  function openEdit(folder) {
    setEditingId(folder.id);
    setDraftName(folder.name);
    setDraftColor(folder.color);
  }
  function handleSave() {
    if (!draftName.trim()) return;
    onSave({ id: editingId === "new" ? uid() : editingId, name: draftName.trim(), color: draftColor });
    setEditingId(null);
  }

  const rowStyle = { display: "flex", alignItems: "center", gap: 10, padding: "10px 12px", background: C.card, borderRadius: 12, marginBottom: 8 };
  const inputStyle = {
    fontFamily: sans,
    fontSize: 15,
    padding: "9px 10px",
    borderRadius: 7,
    border: `1px solid ${C.line}`,
    background: "#fff",
    color: C.ink,

function SwipeableRow({ children, onDelete, deleteLabel = "Delete" }) {
  const REVEAL = 78;
  const [dragX, setDragX] = useState(0);
  const [open, setOpen] = useState(false);
  const [dragging, setDragging] = useState(false);
  const startXRef = useRef(null);
  const baseXRef = useRef(0);

  function start(clientX) {
    startXRef.current = clientX;
    baseXRef.current = open ? -REVEAL : 0;
    setDragging(true);
  }
  function move(clientX) {
    if (startXRef.current == null) return;
    const delta = clientX - startXRef.current;
    const next = Math.max(-REVEAL, Math.min(0, baseXRef.current + delta));
    setDragX(next);
  }
  function end() {
    if (startXRef.current == null) return;
    startXRef.current = null;
    setDragging(false);
    setDragX((current) => {
      const shouldOpen = current < -REVEAL / 2;
      setOpen(shouldOpen);
      return shouldOpen ? -REVEAL : 0;
    });
  }

  return (
    <div style={{ position: "relative", overflow: "hidden" }}>
      <div
        style={{
          position: "absolute",
          inset: 0,
          background: C.tomato,
          display: "flex",
          alignItems: "center",
          justifyContent: "flex-end",
        }}
        onClick={() => {
          setDragX(0);
          setOpen(false);
        }}
      >
        <button
          onClick={(e) => {
            e.stopPropagation();
            onDelete();
            setDragX(0);
            setOpen(false);
          }}
          style={{
            width: REVEAL,
            height: "100%",
            background: "none",
            border: "none",
            cursor: "pointer",
            display: "flex",
            flexDirection: "column",
            alignItems: "center",
            justifyContent: "center",
            gap: 3,
          }}
        >
          <IconTrash size={16} color="#fff" />
          <span style={{ fontSize: 10.5, color: "#fff", fontFamily: sans, fontWeight: 500 }}>{deleteLabel}</span>
        </button>
      </div>
      <div
        onTouchStart={(e) => start(e.touches[0].clientX)}
        onTouchMove={(e) => move(e.touches[0].clientX)}
        onTouchEnd={end}
        onMouseDown={(e) => start(e.clientX)}
        onMouseMove={(e) => {
          if (startXRef.current != null) move(e.clientX);
        }}
        onMouseUp={end}
        onMouseLeave={() => {
          if (startXRef.current != null) end();
        }}
        onClickCapture={(e) => {
          if (open) {
            e.stopPropagation();
            e.preventDefault();
            setDragX(0);
            setOpen(false);
          }
        }}
        style={{
          position: "relative",
          background: C.card,
          transform: `translateX(${dragX}px)`,
          transition: dragging ? "none" : "transform .2s ease-out",
          touchAction: "pan-y",
        }}
      >
        {children}
      </div>
    </div>
  );
}

// ---------- decorative clock ring shown behind the bear on the timer page ----------
function ClockRing({ size = 150 }) {
  const cx = size / 2;
  const cy = size / 2;
  const r = size / 2 - 7;
  const ticks = [];
  for (let i = 0; i < 12; i++) {
    const angle = (i * 30 * Math.PI) / 180;
    const inner = i % 3 === 0 ? r - 10 : r - 6;
    const x1 = cx + Math.sin(angle) * inner;
    const y1 = cy - Math.cos(angle) * inner;
    const x2 = cx + Math.sin(angle) * r;
    const y2 = cy - Math.cos(angle) * r;
    ticks.push(<line key={i} x1={x1} y1={y1} x2={x2} y2={y2} stroke={C.herbDeep} strokeWidth={i % 3 === 0 ? 2.5 : 1.5} strokeLinecap="round" opacity="0.6" />);
  }
  return (
    <svg
      width={size}
      height={size}
      viewBox={`0 0 ${size} ${size}`}
      style={{ position: "absolute", top: "50%", left: "50%", transform: "translate(-50%,-50%)", zIndex: 0 }}
    >
      <circle cx={cx} cy={cy} r={r} fill="none" stroke={C.herbDeep} strokeWidth="3" opacity="0.55" />
      {ticks}
      <line x1={cx} y1={cy} x2={cx - r * 0.28} y2={cy - r * 0.42} stroke={C.herbDeep} strokeWidth="3" strokeLinecap="round" opacity="0.7" />
      <line x1={cx} y1={cy} x2={cx + r * 0.4} y2={cy - r * 0.12} stroke={C.herbDeep} strokeWidth="3" strokeLinecap="round" opacity="0.7" />
      <circle cx={cx} cy={cy} r="4" fill={C.herbDeep} opacity="0.7" />
    </svg>
  );
}

function ProgressRing({ fraction, size = 220, strokeWidth = 14 }) {
  const r = (size - strokeWidth) / 2;
  const c = 2 * Math.PI * r;
  const clamped = Math.max(0, Math.min(1, fraction));
  const offset = c * (1 - clamped);
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={C.paperDim} strokeWidth={strokeWidth} />
      <circle
        cx={size / 2}
        cy={size / 2}
        r={r}
        fill="none"
        stroke={C.herb}
        strokeWidth={strokeWidth}
        strokeLinecap="round"
        strokeDasharray={c}
        strokeDashoffset={offset}
        transform={`rotate(-90 ${size / 2} ${size / 2})`}
        style={{ transition: "stroke-dashoffset .3s linear" }}
      />
    </svg>
  );
}

function fmtClock(ms) {
  const totalSec = Math.max(0, Math.round(ms / 1000));
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  const pad = (n) => String(n).padStart(2, "0");
  return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
}

const TIMER_PRESETS = [1, 3, 5, 10, 15, 20, 30, 45, 60];

// ---------- Timer / Alarm page ----------
function TimerPage({ onBack }) {
  const [subTab, setSubTab] = useState("timer");
  const [loaded, setLoaded] = useState(false);

  const [status, setStatus] = useState("idle"); // idle | running | paused | done
  const [durationMs, setDurationMs] = useState(5 * 60 * 1000);
  const [endTime, setEndTime] = useState(null);
  const [remainingMs, setRemainingMs] = useState(5 * 60 * 1000);
  const [hInput, setHInput] = useState(0);
  const [mInput, setMInput] = useState(5);
  const [sInput, setSInput] = useState(0);

  const [alarms, setAlarms] = useState([]);
  const [alarmFormOpen, setAlarmFormOpen] = useState(false);
  const [alarmTime, setAlarmTime] = useState("07:00");
  const [alarmLabel, setAlarmLabel] = useState("");

  const [ringing, setRinging] = useState(null); // { type: "timer"|"alarm", label }
  const audioCtxRef = useRef(null);
  const ringLoopRef = useRef(null);
  const firedRef = useRef(new Set());
  const snoozeRef = useRef(null);

  useEffect(() => {
    (async () => {
      const [ts, al] = await Promise.all([
        loadKey("timer-state", null),
        loadKey("alarms", []),
      ]);
      if (ts && ts.status === "running" && ts.endTime) {
        const remaining = ts.endTime - Date.now();
        if (remaining > 0) {
          setStatus("running");
          setEndTime(ts.endTime);
          setDurationMs(ts.durationMs);
          setRemainingMs(remaining);
        } else {
          setStatus("idle");
        }
      } else if (ts && ts.status === "paused") {
        setStatus("paused");
        setDurationMs(ts.durationMs);
        setRemainingMs(ts.remainingMs);
      }
      setAlarms(al);
      setLoaded(true);
    })();
  }, []);

  function ensureAudio() {
    if (!audioCtxRef.current) {
      try {
        audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
      } catch (e) {
        // audio not available - alarm will still show visually
      }
    }
    if (audioCtxRef.current && audioCtxRef.current.state === "suspended") {
      audioCtxRef.current.resume().catch(() => {});
    }
  }
  function playChime() {
    const ctx = audioCtxRef.current;
    if (!ctx) return;
    const now = ctx.currentTime;
    for (let i = 0; i < 3; i++) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.0001, now + i * 0.45);
      gain.gain.exponentialRampToValueAtTime(0.28, now + i * 0.45 + 0.04);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.45 + 0.38);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now + i * 0.45);
      osc.stop(now + i * 0.45 + 0.4);
    }
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
  }
  function startRinging(type, label) {
    setRinging({ type, label });
    playChime();
    if (ringLoopRef.current) clearInterval(ringLoopRef.current);
    ringLoopRef.current = setInterval(playChime, 2200);
  }
  function stopRinging() {
    setRinging(null);
    if (ringLoopRef.current) {
      clearInterval(ringLoopRef.current);
      ringLoopRef.current = null;
    }
  }

  // countdown ticking
  useEffect(() => {
    if (status !== "running") return;
    const id = setInterval(() => {
      const remaining = endTime - Date.now();
      if (remaining <= 0) {
        setRemainingMs(0);
        setStatus("done");
        saveKey("timer-state", { status: "idle" });
        startRinging("timer", "Timer done");
      } else {
        setRemainingMs(remaining);
      }
    }, 250);
    return () => clearInterval(id);
  }, [status, endTime]);

  // alarm checking (every second, regardless of which sub-tab is open)
  useEffect(() => {
    const id = setInterval(() => {
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, "0");
      const mm = String(now.getMinutes()).padStart(2, "0");
      const nowKeyBase = `${hh}:${mm}`;
      alarms.forEach((a) => {
        if (!a.enabled) return;
        if (a.time !== nowKeyBase) return;
        const fireKey = `${a.id}-${nowKeyBase}`;
        if (firedRef.current.has(fireKey)) return;
        firedRef.current.add(fireKey);
        ensureAudio();
        startRinging("alarm", a.label || "Alarm");
      });
      if (snoozeRef.current && Date.now() >= snoozeRef.current) {
        snoozeRef.current = null;
        ensureAudio();
        startRinging("alarm", "Snoozed alarm");
      }
      // eslint-disable-next-line
    }, 1000);
    return () => clearInterval(id);
  }, [alarms]);

  useEffect(() => {
    return () => {
      if (ringLoopRef.current) clearInterval(ringLoopRef.current);
    };
  }, []);

  function handleStart() {
    ensureAudio();
    const total = (Number(hInput) || 0) * 3600000 + (Number(mInput) || 0) * 60000 + (Number(sInput) || 0) * 1000;
    if (total <= 0) return;
    const end = Date.now() + total;
    setDurationMs(total);
    setEndTime(end);
    setRemainingMs(total);
    setStatus("running");
    saveKey("timer-state", { status: "running", endTime: end, durationMs: total });
  }
  function handlePreset(min) {
    setHInput(Math.floor(min / 60));
    setMInput(min % 60);
    setSInput(0);
  }
  function handlePause() {
    const remaining = Math.max(0, endTime - Date.now());
    setRemainingMs(remaining);
    setStatus("paused");
    saveKey("timer-state", { status: "paused", remainingMs: remaining, durationMs });
  }
  function handleResume() {
    const end = Date.now() + remainingMs;
    setEndTime(end);
    setStatus("running");
    saveKey("timer-state", { status: "running", endTime: end, durationMs });
  }
  function handleCancel() {
    setStatus("idle");
    setRemainingMs(durationMs);
    saveKey("timer-state", { status: "idle" });
  }
  function handleStopRinging() {
    stopRinging();
    if (ringing?.type === "timer") {
      setStatus("idle");
      saveKey("timer-state", { status: "idle" });
    }
  }
  function handleSnooze() {
    stopRinging();
    snoozeRef.current = Date.now() + 5 * 60 * 1000;
  }

  function persistAlarms(next) {
    setAlarms(next);
    saveKey("alarms", next);
  }
  function addAlarm() {
    if (!alarmTime) return;
    const next = [...alarms, { id: uid(), time: alarmTime, label: alarmLabel.trim(), enabled: true }];
    persistAlarms(next);
    setAlarmLabel("");
    setAlarmFormOpen(false);
  }
  function toggleAlarm(id) {
    persistAlarms(alarms.map((a) => (a.id === id ? { ...a, enabled: !a.enabled } : a)));
  }
  function deleteAlarm(id) {
    persistAlarms(alarms.filter((a) => a.id !== id));
  }
  function fmtAlarmTime(t) {
    const [h, m] = t.split(":").map(Number);
    const period = h >= 12 ? "PM" : "AM";
    const h12 = h % 12 === 0 ? 12 : h % 12;
    return `${h12}:${String(m).padStart(2, "0")} ${period}`;
  }

  const inputBoxStyle = {
    fontFamily: sans,
    fontSize: 22,
    fontWeight: 600,
    textAlign: "center",
    width: 58,
    padding: "10px 4px",
    borderRadius: 10,
    border: `1px solid ${C.line}`,
    background: "#fff",
    color: C.ink,
    boxSizing: "border-box",
  };

  if (!loaded) {

            <>
              <div style={{ display: "flex", gap: 10, alignItems: "center", marginBottom: 18 }}>
                <div style={{ textAlign: "center" }}>
                  <input type="number" min="0" max="23" style={inputBoxStyle} value={hInput} onChange={(e) => setHInput(e.target.value)} />
                  <div style={{ fontSize: 11, color: C.inkSoft, marginTop: 4 }}>hr</div>
                </div>
                <div style={{ textAlign: "center" }}>
                  <input type="number" min="0" max="59" style={inputBoxStyle} value={mInput} onChange={(e) => setMInput(e.target.value)} />
                  <div style={{ fontSize: 11, color: C.inkSoft, marginTop: 4 }}>min</div>
                </div>
                <div style={{ textAlign: "center" }}>
                  <input type="number" min="0" max="59" style={inputBoxStyle} value={sInput} onChange={(e) => setSInput(e.target.value)} />
                  <div style={{ fontSize: 11, color: C.inkSoft, marginTop: 4 }}>sec</div>
                </div>

              <div style={{ display: "flex", flexWrap: "wrap", gap: 6, justifyContent: "center", marginBottom: 24, maxWidth: 320 }}>
                {TIMER_PRESETS.map((min) => (
                  <button
                    key={min}
                    onClick={() => handlePreset(min)}
                    style={{
                      fontFamily: sans,
                      fontSize: 12.5,
                      padding: "6px 11px",
                      borderRadius: 999,
                      border: "none",
                      background: C.paperDim,
                      color: C.herbDeep,
                      cursor: "pointer",

              <Btn variant="primary" onClick={handleStart} style={{ padding: "13px 40px", fontSize: 15 }}>
                Start

            </>
          )}

          {(status === "running" || status === "paused") && (
            <>
              <div style={{ position: "relative", width: 220, height: 220, display: "flex", alignItems: "center", justifyContent: "center", marginBottom: 24 }}>
                <ProgressRing fraction={durationMs ? remainingMs / durationMs : 0} />
                <div style={{ position: "absolute", fontFamily: serif, fontSize: 40, fontWeight: 700, color: C.ink }}>
                  {fmtClock(remainingMs)}
                </div>
              </div>
              <div style={{ display: "flex", gap: 12 }}>
                <Btn variant="ghost" onClick={handleCancel} style={{ padding: "12px 28px" }}>
                  Cancel
                </Btn>
                {status === "running" ? (
                  <Btn variant="primary" onClick={handlePause} style={{ padding: "12px 28px" }}>
                    Pause
                  </Btn>
                ) : (
                  <Btn variant="primary" onClick={handleResume} style={{ padding: "12px 28px" }}>
                    Resume
                  </Btn>
                )}
              </div>
            </>
          )}
        </div>
      )}

      {subTab === "alarm" && (
        <div>
          {alarms.length === 0 ? (
            <EmptyState text="No alarms yet. Add one below." />
          ) : (
            <div style={{ background: C.card, boxShadow: "0 1px 3px rgba(74,54,38,0.08)", borderRadius: 14, overflow: "hidden", marginBottom: 16 }}>
              {alarms.map((a, idx) => (
                <div key={a.id} style={{ borderBottom: idx < alarms.length - 1 ? `1px solid ${C.paperDim}` : "none" }}>
                  <SwipeableRow onDelete={() => deleteAlarm(a.id)}>
                    <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "13px 14px" }}>
                      <div style={{ flex: 1, minWidth: 0, opacity: a.enabled ? 1 : 0.45 }}>
                        <div style={{ fontFamily: serif, fontSize: 20, fontWeight: 600, color: C.ink }}>{fmtAlarmTime(a.time)}</div>
                        {a.label && <div style={{ fontSize: 12.5, color: C.inkSoft }}>{a.label}</div>}
                      </div>
                      <button
                        onClick={() => toggleAlarm(a.id)}
                        aria-label="Toggle alarm"
                        style={{
                          width: 44,
                          height: 26,
                          borderRadius: 999,
                          border: "none",
                          cursor: "pointer",
                          background: a.enabled ? C.herb : C.line,
                          position: "relative",
                          flexShrink: 0,
                          padding: 0,
                        }}
                      >
                        <span
                          style={{
                            position: "absolute",
                            top: 3,
                            left: a.enabled ? 21 : 3,
                            width: 20,
                            height: 20,
                            borderRadius: "50%",
                            background: "#fff",
                            transition: "left .15s ease-out",
                            boxShadow: "0 1px 2px rgba(0,0,0,0.2)",
                          }}
                        />
                      </button>
                    </div>
                  </SwipeableRow>
                </div>
              ))}
            </div>
          )}

          {alarmFormOpen ? (
            <div style={{ background: C.paperDim, borderRadius: 14, padding: 14 }}>
              <label style={{ fontSize: 13, fontWeight: 500, color: C.inkSoft, marginBottom: 5, display: "block" }}>Time</label>
              <input
                type="time"
                value={alarmTime}
                onChange={(e) => setAlarmTime(e.target.value)}
                style={{ fontFamily: sans, fontSize: 16, padding: "9px 10px", borderRadius: 8, border: `1px solid ${C.line}`, background: "#fff", color: C.ink, marginBottom: 12, width: "100%", boxSizing: "border-box" }}
              />
              <label style={{ fontSize: 13, fontWeight: 500, color: C.inkSoft, marginBottom: 5, display: "block" }}>Label (optional)</label>
              <input
                type="text"
                value={alarmLabel}
                onChange={(e) => setAlarmLabel(e.target.value)}
                placeholder="e.g. Take bread out"
                style={{ fontFamily: sans, fontSize: 15, padding: "9px 10px", borderRadius: 8, border: `1px solid ${C.line}`, background: "#fff", color: C.ink, marginBottom: 14, width: "100%", boxSizing: "border-box" }}
              />
              <div style={{ display: "flex", gap: 10 }}>
                <Btn variant="primary" onClick={addAlarm} style={{ flex: 1, justifyContent: "center" }}>
                  Save
                </Btn>
                <Btn variant="ghost" onClick={() => setAlarmFormOpen(false)} style={{ flex: 1, justifyContent: "center" }}>
                  Cancel
                </Btn>
              </div>
            </div>
          ) : (
            <Btn variant="primary" onClick={() => { ensureAudio(); setAlarmFormOpen(true); }}>
              <IconPlus size={16} color="#fff" /> Add alarm
            </Btn>
          )}
          <p style={{ fontSize: 12, color: C.inkSoft, marginTop: 16, lineHeight: 1.5 }}>
            Alarms only ring while this app is open in your browser — like any web page, it can't wake your phone or ring in the background.
          </p>
        </div>
      )}

      {ringing && (
        <div
          style={{
            position: "fixed",
            inset: 0,
            background: "rgba(35,48,61,0.85)",
            display: "flex",
            flexDirection: "column",
            alignItems: "center",
            justifyContent: "center",
            zIndex: 90,
            animation: "fadeIn .2s ease-out",
            padding: 24,
          }}
        >
          <div style={{ animation: "popIn .3s ease-out" }}>
            <BearIllustration width={110} />
          </div>
          <h2 style={{ fontFamily: serif, fontSize: 24, color: "#fff", margin: "18px 0 6px", textAlign: "center" }}>
            {ringing.type === "timer" ? "Time's up!" : ringing.label}
          </h2>
          <p style={{ color: "#fff", opacity: 0.75, fontSize: 13, marginBottom: 28 }}>
            {ringing.type === "timer" ? "Your timer has finished." : fmtAlarmTime(new Date().toTimeString().slice(0, 5))}
          </p>
          <div style={{ display: "flex", gap: 12 }}>
            {ringing.type === "alarm" && (
              <Btn variant="ghost" onClick={handleSnooze} style={{ padding: "13px 26px", background: "#fff" }}>
                Snooze 5m
              </Btn>
            )}
            <Btn variant="tomato" onClick={handleStopRinging} style={{ padding: "13px 32px" }}>
              Stop
            </Btn>
          </div>
        </div>
      )}
    </div>
  );
}

// ---------- Main app ----------
function MealPlanner() {
  const [tab, setTab] = useState("recipes");
  const [recipes, setRecipes] = useState([]);
  const [calendar, setCalendar] = useState({});
  const [groceryChecked, setGroceryChecked] = useState({});
  const [folders, setFolders] = useState([]);
  const [pantry, setPantry] = useState([]);
  const [loaded, setLoaded] = useState(false);

  const [formOpen, setFormOpen] = useState(false);
  const [editingRecipe, setEditingRecipe] = useState(null);
  const [viewingRecipe, setViewingRecipe] = useState(null);
  const [addToDayTarget, setAddToDayTarget] = useState(null); // { date, mealId }
  const [weekStart, setWeekStart] = useState(getMonday(new Date()));
  const [folderModalOpen, setFolderModalOpen] = useState(false);
  const [pantryInput, setPantryInput] = useState("");
  const [confirmTarget, setConfirmTarget] = useState(null); // { type, id, label }
  const [recipeSearch, setRecipeSearch] = useState("");
  const [extraGroceryItems, setExtraGroceryItems] = useState({}); // weekKey -> [{id,name,qty,unit,category}]
  const [groceryQuickInput, setGroceryQuickInput] = useState("");
  const [shareStatus, setShareStatus] = useState("");
  const [groceryDismissed, setGroceryDismissed] = useState({}); // "weekKey::itemKey" -> true
  const [view, setView] = useState("main"); // "main" | "timer"
  const [flipCount, setFlipCount] = useState(0);
  const [pantryUndo, setPantryUndo] = useState([]); // [{id, label, item}]
  const [groceryUndo, setGroceryUndo] = useState([]); // [{id, label, dismissKey}]
  const [importPreview, setImportPreview] = useState(null);
  const [importError, setImportError] = useState("");
  const fileInputRef = useRef(null);
  const [draggingRecipe, setDraggingRecipe] = useState(null); // { id, name }
  const [dragPos, setDragPos] = useState({ x: 0, y: 0 });
  const [dragOverFolder, setDragOverFolder] = useState(null); // folder id, "unfiled", or null
  const [showConfetti, setShowConfetti] = useState(false);
  const [vanishingPantryIds, setVanishingPantryIds] = useState([]);
  const prevAllCheckedRef = useRef(false);

  useEffect(() => {
    (async () => {
      const [rRaw, cRaw, g, f, p, eg, gd] = await Promise.all([
        loadKey("recipes", []),
        loadKey("calendar", {}),
        loadKey("grocery-checked", {}),
        loadKey("folders", []),
        loadKey("pantry", []),
        loadKey("extra-grocery", {}),
        loadKey("grocery-dismissed", {}),
      ]);
      const r = rRaw.map(migrateRecipe);
      const c = {};
      Object.entries(cRaw).forEach(([date, entry]) => {
        c[date] = migrateDayEntry(entry);
      });
      setRecipes(r);
      setCalendar(c);
      setGroceryChecked(g);
      setFolders(f);
      setPantry(p);
      setExtraGroceryItems(eg);
      setGroceryDismissed(gd);
      setLoaded(true);
      saveKey("recipes", r);
      saveKey("calendar", c);
    })();
  }, []);

  const persistRecipes = useCallback((next) => {
    setRecipes(next);
    saveKey("recipes", next);
  }, []);
  const persistCalendar = useCallback((next) => {
    setCalendar(next);
    saveKey("calendar", next);
  }, []);
  const persistGrocery = useCallback((next) => {
    setGroceryChecked(next);
    saveKey("grocery-checked", next);
  }, []);
  const persistFolders = useCallback((next) => {
    setFolders(next);
    saveKey("folders", next);
  }, []);
  const persistPantry = useCallback((next) => {
    setPantry(next);
    saveKey("pantry", next);
  }, []);
  const persistExtraGrocery = useCallback((next) => {
    setExtraGroceryItems(next);
    saveKey("extra-grocery", next);
  }, []);
  const persistGroceryDismissed = useCallback((next) => {
    setGroceryDismissed(next);
    saveKey("grocery-dismissed", next);
  }, []);
  function dismissGroceryItem(itemKey, itemName) {
    const dismissKey = `${toISO(weekStart)}::${itemKey}`;
    persistGroceryDismissed({ ...groceryDismissed, [dismissKey]: true });
    setGroceryUndo((prev) => [...prev, { id: uid(), label: itemName, dismissKey }]);
  }
  function undoGroceryDismiss(entryId) {
    setGroceryUndo((prev) => {
      const entry = prev.find((e) => e.id === entryId);
      if (entry) {
        setGroceryDismissed((gd) => {
          const next = { ...gd };
          delete next[entry.dismissKey];
          saveKey("grocery-dismissed", next);
          return next;
        });
      }
      return prev.filter((e) => e.id !== entryId);
    });
  }

  function addPantryItem(text) {
    const trimmed = text.trim();
    if (!trimmed) return;
    const parsed = parseIngredientLine(trimmed);
    if (!parsed.name) return;
    const key = parsed.name.toLowerCase();
    const unitKey = (parsed.unit || "").toLowerCase();
    const newQtyNum = parseQty(parsed.qty);
    const existingIdx = pantry.findIndex((p) => p.name.toLowerCase() === key && (p.unit || "").toLowerCase() === unitKey);
    if (existingIdx >= 0) {
      const existing = pantry[existingIdx];
      const existingQtyNum = parseQty(String(existing.qty));
      let mergedQty = existing.qty;
      if (!isNaN(newQtyNum) && !isNaN(existingQtyNum)) mergedQty = existingQtyNum + newQtyNum;
      else if (!isNaN(newQtyNum)) mergedQty = newQtyNum;
      const next = pantry.map((p, i) => (i === existingIdx ? { ...p, qty: mergedQty } : p));
      persistPantry(next);
    } else {
      const item = {
        id: uid(),
        name: parsed.name,
        qty: !isNaN(newQtyNum) ? newQtyNum : "",
        unit: parsed.unit || "",
        category: guessCategory(parsed.name),
      };
      persistPantry([...pantry, item]);
    }
  }
  function adjustPantryQty(id, delta) {
    const current = pantry.find((p) => p.id === id);
    if (!current) return;
    const currentQty = isNaN(parseQty(String(current.qty))) ? 0 : parseQty(String(current.qty));
    const updated = currentQty + delta;
    if (updated <= 0) {
      setVanishingPantryIds((prev) => (prev.includes(id) ? prev : [...prev, id]));
      setTimeout(() => {
        setPantry((prev) => {
          const next = prev.filter((p) => p.id !== id);
          saveKey("pantry", next);
          return next;
        });
        setVanishingPantryIds((prev) => prev.filter((v) => v !== id));
      }, 260);
    } else {
      persistPantry(pantry.map((p) => (p.id === id ? { ...p, qty: updated } : p)));
    }
  }
  function removePantryItem(id) {
    persistPantry(pantry.filter((p) => p.id !== id));
  }

  function saveFolder(folder) {
    const exists = folders.some((f) => f.id === folder.id);
    const next = exists ? folders.map((f) => (f.id === folder.id ? folder : f)) : [...folders, folder];
    persistFolders(next);
  }
  function deleteFolder(id) {
    persistFolders(folders.filter((f) => f.id !== id));
    persistRecipes(recipes.map((r) => (r.folderId === id ? { ...r, folderId: null } : r)));
  }

  function saveRecipe(recipe) {
    const exists = recipes.some((r) => r.id === recipe.id);
    const next = exists ? recipes.map((r) => (r.id === recipe.id ? recipe : r)) : [...recipes, recipe];
    persistRecipes(next);
    setFormOpen(false);
    setEditingRecipe(null);
  }
  function deleteRecipe(id) {
    persistRecipes(recipes.filter((r) => r.id !== id));
    const nextCal = {};
    Object.entries(calendar).forEach(([date, slots]) => {
      nextCal[date] = {
        breakfast: slots.breakfast.filter((i) => i !== id),
        lunch: slots.lunch.filter((i) => i !== id),
        dinner: slots.dinner.filter((i) => i !== id),
      };
    });
    persistCalendar(nextCal);
  }
  function addToDay(date, mealId, recipeId) {
    const key = toISO(date);
    const existing = calendar[key] || { breakfast: [], lunch: [], dinner: [] };
    const nextEntry = { ...existing, [mealId]: [...existing[mealId], recipeId] };
    persistCalendar({ ...calendar, [key]: nextEntry });
    setAddToDayTarget(null);
  }
  function removeFromDay(dateKey, mealId, index) {
    const existing = calendar[dateKey] || { breakfast: [], lunch: [], dinner: [] };
    const nextEntry = { ...existing, [mealId]: existing[mealId].filter((_, i) => i !== index) };
    persistCalendar({ ...calendar, [dateKey]: nextEntry });
  }
  function togglePantryIngredient(ing) {
    const key = ing.name.toLowerCase();
    const unitKey = (ing.unit || "").toLowerCase();
    const alreadyIn = pantry.some((p) => p.name.toLowerCase() === key && (p.unit || "").toLowerCase() === unitKey);
    if (alreadyIn) {
      persistPantry(pantry.filter((p) => !(p.name.toLowerCase() === key && (p.unit || "").toLowerCase() === unitKey)));
      return;
    }
    const qtyNum = parseQty(ing.qty);
    const item = {
      id: uid(),
      name: ing.name,
      qty: !isNaN(qtyNum) ? qtyNum : "",
      unit: ing.unit || "",
      category: ing.category || guessCategory(ing.name),
    };
    persistPantry([...pantry, item]);
  }
  function addExtraGroceryItem(text) {
    const trimmed = text.trim();
    if (!trimmed) return;
    const parsed = parseIngredientLine(trimmed);
    if (!parsed.name) return;
    const key = toISO(weekStart);
    const item = {
      id: uid(),
      name: parsed.name,
      qty: parsed.qty,
      unit: parsed.unit,
      category: guessCategory(parsed.name),
    };
    const list = extraGroceryItems[key] || [];
    persistExtraGrocery({ ...extraGroceryItems, [key]: [...list, item] });
  }
  function removeExtraGroceryItem(id) {
    const key = toISO(weekStart);
    const list = extraGroceryItems[key] || [];
    persistExtraGrocery({ ...extraGroceryItems, [key]: list.filter((i) => i.id !== id) });
  }

  function requestDelete(type, id, label) {
    setConfirmTarget({ type, id, label });
  }
  function confirmDelete() {
    if (!confirmTarget) return;
    if (confirmTarget.type === "recipe") deleteRecipe(confirmTarget.id);
    else if (confirmTarget.type === "folder") deleteFolder(confirmTarget.id);
    else if (confirmTarget.type === "pantry") {
      const item = pantry.find((p) => p.id === confirmTarget.id);
      removePantryItem(confirmTarget.id);
      if (item) {
        setPantryUndo((prev) => [...prev, { id: uid(), label: item.name, item }]);
      }
    }
    setConfirmTarget(null);
  }
  function undoPantryRemove(entryId) {
    setPantryUndo((prev) => {
      const entry = prev.find((e) => e.id === entryId);
      if (entry) {
        setPantry((p) => {
          const next = [...p, entry.item];
          saveKey("pantry", next);
          return next;
        });
      }
      return prev.filter((e) => e.id !== entryId);
    });
  }

  function moveRecipeToFolder(recipeId, folderId) {
    persistRecipes(recipes.map((r) => (r.id === recipeId ? { ...r, folderId } : r)));
  }
  function findDropZone(x, y) {
    const el = document.elementFromPoint(x, y);
    const zone = el && el.closest ? el.closest("[data-folder-drop]") : null;
    return zone ? zone.getAttribute("data-folder-drop") : null;
  }
  const dragOverFolderRef = useRef(null);
  function startRecipeDrag(recipe, x, y) {
    setDraggingRecipe({ id: recipe.id, name: recipe.name });
    setDragPos({ x, y });
    const zone = findDropZone(x, y);
    dragOverFolderRef.current = zone;
    setDragOverFolder(zone);
  }
  function updateRecipeDrag(x, y) {
    setDragPos({ x, y });
    const zone = findDropZone(x, y);
    dragOverFolderRef.current = zone;
    setDragOverFolder(zone);
  }
  function endRecipeDrag() {
    const finalZone = dragOverFolderRef.current;
    setDraggingRecipe((current) => {
      if (current && finalZone) {
        moveRecipeToFolder(current.id, finalZone === "unfiled" ? null : finalZone);
      }
      return null;
    });
    dragOverFolderRef.current = null;
    setDragOverFolder(null);
  }

  useEffect(() => {
    if (!draggingRecipe) return;
    function onMove(e) {
      updateRecipeDrag(e.clientX, e.clientY);
    }
    function onUp() {
      endRecipeDrag();
    }
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
    return () => {
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
    };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [draggingRecipe]);

  function buildExportData() {
    return {
      app: "trinhs-planner",
      version: 1,
      exportedAt: new Date().toISOString(),
      recipes,
      calendar,
      groceryChecked,
      folders,
      pantry,
      extraGroceryItems,
      groceryDismissed,
    };
  }
  async function handleExport() {
    const data = buildExportData();
    const json = JSON.stringify(data, null, 2);
    const filename = `trinhs-planner-backup-${toISO(new Date())}.json`;
    try {
      const file = new File([json], filename, { type: "application/json" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: "Trinh's Planner backup" });
        return;
      }
    } catch (e) {
      // fall through to plain download
    }
    try {
      const url = URL.createObjectURL(new Blob([json], { type: "application/json" }));
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    } catch (e) {
      // nothing more we can do here
    }
  }
  function handleImportFileSelected(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!data || typeof data !== "object") throw new Error("bad format");
        setImportPreview(data);
        setImportError("");
      } catch (err) {
        setImportPreview({});
        setImportError("That file doesn't look like a valid Trinh's Planner backup.");
      }
    };
    reader.onerror = () => {
      setImportPreview({});
      setImportError("Couldn't read that file.");
    };
    reader.readAsText(file);
  }
  function applyImportReplace() {
    const data = importPreview;
    if (!data) return;
    const r = (data.recipes || []).map(migrateRecipe);
    const c = {};
    Object.entries(data.calendar || {}).forEach(([date, entry]) => {
      c[date] = migrateDayEntry(entry);
    });
    persistRecipes(r);
    persistCalendar(c);
    persistGrocery(data.groceryChecked || {});
    persistFolders(data.folders || []);
    persistPantry(data.pantry || []);
    persistExtraGrocery(data.extraGroceryItems || {});
    persistGroceryDismissed(data.groceryDismissed || {});
    setImportPreview(null);
  }
  function applyImportMerge() {
    const data = importPreview;
    if (!data) return;

    const existingRecipeIds = new Set(recipes.map((r) => r.id));
    const incomingRecipes = (data.recipes || []).map(migrateRecipe).filter((r) => !existingRecipeIds.has(r.id));
    persistRecipes([...recipes, ...incomingRecipes]);

    const existingFolderIds = new Set(folders.map((f) => f.id));
    const incomingFolders = (data.folders || []).filter((f) => !existingFolderIds.has(f.id));
    persistFolders([...folders, ...incomingFolders]);

    const existingPantryIds = new Set(pantry.map((p) => p.id));
    const incomingPantry = (data.pantry || []).filter((p) => !existingPantryIds.has(p.id));
    persistPantry([...pantry, ...incomingPantry]);

    const mergedCalendar = { ...calendar };
    Object.entries(data.calendar || {}).forEach(([date, rawEntry]) => {
      const entry = migrateDayEntry(rawEntry);
      const existing = mergedCalendar[date] || { breakfast: [], lunch: [], dinner: [] };
      mergedCalendar[date] = {
        breakfast: Array.from(new Set([...existing.breakfast, ...entry.breakfast])),
        lunch: Array.from(new Set([...existing.lunch, ...entry.lunch])),
        dinner: Array.from(new Set([...existing.dinner, ...entry.dinner])),
      };
    });
    persistCalendar(mergedCalendar);

    persistGrocery({ ...groceryChecked, ...(data.groceryChecked || {}) });
    persistGroceryDismissed({ ...groceryDismissed, ...(data.groceryDismissed || {}) });

    const mergedExtra = { ...extraGroceryItems };
    Object.entries(data.extraGroceryItems || {}).forEach(([wk, items]) => {
      const existingIds = new Set((mergedExtra[wk] || []).map((i) => i.id));
      mergedExtra[wk] = [...(mergedExtra[wk] || []), ...(items || []).filter((i) => !existingIds.has(i.id))];
    });
    persistExtraGrocery(mergedExtra);

    setImportPreview(null);
  }

  const recipesById = useMemo(() => Object.fromEntries(recipes.map((r) => [r.id, r])), [recipes]);
  const filteredRecipes = useMemo(() => {
    const q = recipeSearch.trim().toLowerCase();
    return q ? recipes.filter((r) => r.name.toLowerCase().includes(q)) : recipes;
  }, [recipes, recipeSearch]);
  const filteredRecipeGroups = useMemo(() => groupByFolder(filteredRecipes, folders), [filteredRecipes, folders]);
  const allKnownItems = useMemo(() => {
    const map = new Map();
    COMMON_ITEMS.forEach((n) => map.set(n.toLowerCase(), n));
    recipes.forEach((r) => r.ingredients.forEach((i) => { if (i.name) map.set(i.name.toLowerCase(), i.name); }));
    return Array.from(map.values()).sort((a, b) => a.localeCompare(b));
  }, [recipes]);
  const weekDates = useMemo(() => Array.from({ length: 7 }, (_, i) => addDays(weekStart, i)), [weekStart]);

  const pantryByName = useMemo(() => {
    const map = {};
    pantry.forEach((p) => {
      const key = p.name.trim().toLowerCase();
      if (!map[key]) map[key] = [];
      map[key].push(p);
    });
    return map;
  }, [pantry]);

  const pantryGroups = useMemo(() => {
    const groups = {};
    pantry.forEach((item) => {
      const cat = item.category || "Other";
      if (!groups[cat]) groups[cat] = [];
      groups[cat].push(item);
    });
    Object.values(groups).forEach((list) => list.sort((a, b) => a.name.localeCompare(b.name)));
    return CATEGORIES.map((cat) => ({ cat, items: groups[cat] || [] })).filter((g) => g.items.length > 0);
  }, [pantry]);

  const groceryList = useMemo(() => {
    const totals = {};
    weekDates.forEach((d) => {
      const entry = calendar[toISO(d)] || { breakfast: [], lunch: [], dinner: [] };
      const ids = [...entry.breakfast, ...entry.lunch, ...entry.dinner];
      ids.forEach((id) => {
        const recipe = recipesById[id];
        if (!recipe) return;
        recipe.ingredients.forEach((ing) => {
          const key = `${ing.name.toLowerCase()}|${ing.unit}`;
          if (!totals[key]) {
            totals[key] = { name: ing.name, unit: ing.unit, qty: 0, hasQty: false, category: ing.category || "Other" };
          }
          const n = parseQty(ing.qty);
          if (!isNaN(n)) {
            totals[key].qty += n;
            totals[key].hasQty = true;
          }
        });
      });
    });

    // fold in manually-added extra items for this week
    const extras = extraGroceryItems[toISO(weekStart)] || [];
    extras.forEach((ing) => {
      const key = `${ing.name.toLowerCase()}|${ing.unit || ""}`;
      if (!totals[key]) {
        totals[key] = { name: ing.name, unit: ing.unit || "", qty: 0, hasQty: false, category: ing.category || "Other" };
      }
      const n = parseQty(ing.qty);
      if (!isNaN(n)) {
        totals[key].qty += n;
        totals[key].hasQty = true;
      }
    });

    // subtract what's already in the pantry
    Object.keys(totals).forEach((key) => {
      const item = totals[key];
      const pantryMatches = pantryByName[item.name.trim().toLowerCase()];
      if (!pantryMatches || pantryMatches.length === 0) return;
      const sameUnit = pantryMatches.find((p) => (p.unit || "").toLowerCase() === (item.unit || "").toLowerCase() && !isNaN(parseQty(String(p.qty))));
      if (sameUnit && item.hasQty) {
        const remainder = item.qty - parseQty(String(sameUnit.qty));
        if (remainder <= 0.001) {
          delete totals[key];
        } else {
          item.qty = remainder;
          item.pantryAdjusted = true;
        }
        return;
      }
      const presenceOnly = pantryMatches.some((p) => isNaN(parseQty(String(p.qty))));
      if (presenceOnly) {
        delete totals[key];
      }
    });

    const weekK = toISO(weekStart);
    return Object.entries(totals)
      .map(([key, v]) => ({ key, ...v }))
      .filter((item) => !groceryDismissed[`${weekK}::${item.key}`])
      .sort((a, b) => a.name.localeCompare(b.name));
  }, [calendar, weekDates, recipesById, pantryByName, extraGroceryItems, weekStart, groceryDismissed]);

  const groupedGrocery = useMemo(() => {
    const groups = {};
    groceryList.forEach((item) => {
      const cat = item.category || "Other";
      if (!groups[cat]) groups[cat] = [];
      groups[cat].push(item);
    });
    return CATEGORIES.map((cat) => ({ cat, items: groups[cat] || [] })).filter((g) => g.items.length > 0);
  }, [groceryList]);

  const weekKey = toISO(weekStart);

  const allGroceryChecked = groceryList.length > 0 && groceryList.every((item) => groceryChecked[`${weekKey}::${item.key}`]);
  useEffect(() => {

  function buildShareText() {
    const lines = [`Grocery List — ${fmtDate(weekStart)} – ${fmtDate(addDays(weekStart, 6))}`, ""];

        lines.push(`${checked ? "✓" : "•"} ${qtyStr}${item.name}`);
      });
      lines.push("");
    });
    return lines.join("\n").trim();
  }
