// ---------- date helpers ----------
function toISO(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
function addDays(d, n) {
  const nd = new Date(d);
  nd.setDate(nd.getDate() + n);
  return nd;
}
function getMonday(d) {
  const nd = new Date(d);
  const day = nd.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  nd.setDate(nd.getDate() + diff);
  nd.setHours(0, 0, 0, 0);
  return nd;
}
function fmtDay(d) {
  return d.toLocaleDateString(undefined, { weekday: "short" });
}
function fmtDate(d) {
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}
function uid() {
  return Math.random().toString(36).slice(2, 10);
}

// ---------- quantity helpers (support fractions like "1 1/2", "3/4") ----------
function parseQty(str) {
  if (!str) return NaN;
  const parts = String(str).trim().split(/\s+/);
  let total = 0;
  let found = false;
  for (const p of parts) {
    if (p.includes("/")) {
      const [n, d] = p.split("/").map(Number);
      if (d) {
        total += n / d;
        found = true;
      }
    } else {
      const v = parseFloat(p);
      if (!isNaN(v)) {
        total += v;
        found = true;
      }
    }
  }
  return found ? total : NaN;
}
const NICE_FRACTIONS = [
  [0, ""], [0.125, "\u215b"], [0.25, "\u00bc"], [0.333, "\u2153"], [0.375, "\u215c"],
  [0.5, "\u00bd"], [0.625, "\u215d"], [0.667, "\u2154"], [0.75, "\u00be"], [0.875, "\u215e"], [1, ""],
];
function formatQty(n) {
  if (n == null || isNaN(n)) return "";
  const rounded = Math.round(n * 1000) / 1000;
  let whole = Math.floor(rounded);
  const frac = rounded - whole;
  let best = NICE_FRACTIONS[0];
  let bestDiff = Infinity;
  for (const pair of NICE_FRACTIONS) {
    const diff = Math.abs(frac - pair[0]);
    if (diff < bestDiff) {
      bestDiff = diff;
      best = pair;
    }
  }
  let symbol = best[1];
  if (best[0] === 1) {
    whole += 1;
    symbol = "";
  }
  if (whole === 0 && symbol) return symbol;
  if (symbol) return `${whole} ${symbol}`;
  return `${whole}`;
}

// ---------- storage helpers (plain browser localStorage - private to this device) ----------
const STORAGE_PREFIX = "trinhs-planner:";
async function loadKey(key, fallback) {
  try {
    const raw = localStorage.getItem(STORAGE_PREFIX + key);
    return raw != null ? JSON.parse(raw) : fallback;
  } catch (e) {
    return fallback;
  }
}
async function saveKey(key, value) {
  try {
    localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(value));
  } catch (e) {
    console.error("storage save failed", key, e);
  }
}

// ---------- migration helpers ----------
function migrateRecipe(r) {
  return {
    ...r,
    folderId: r.folderId || null,
    ingredients: (r.ingredients || []).map((i) => ({ ...i, category: i.category || "Other" })),
  };
}
function groupByFolder(list, folders) {
  const byId = {};
  folders.forEach((f) => {
    byId[f.id] = { folder: f, recipes: [] };
  });
  const unfiled = { folder: null, recipes: [] };
  list.forEach((r) => {
    if (r.folderId && byId[r.folderId]) byId[r.folderId].recipes.push(r);
    else unfiled.recipes.push(r);
  });
  const groups = folders.map((f) => byId[f.id]);
  if (unfiled.recipes.length > 0) groups.push(unfiled);
  return groups;
}
function migrateDayEntry(entry) {
  if (Array.isArray(entry)) {
    return { breakfast: [], lunch: [], dinner: entry };
  }
  return { breakfast: entry?.breakfast || [], lunch: entry?.lunch || [], dinner: entry?.dinner || [] };
}

// ---------- ingredient text / recipe-site import helpers ----------
const FRACTION_MAP = {
  "¼": "1/4", "½": "1/2", "¾": "3/4", "⅓": "1/3", "⅔": "2/3",
  "⅕": "1/5", "⅖": "2/5", "⅗": "3/5", "⅘": "4/5",
  "⅙": "1/6", "⅚": "5/6", "⅛": "1/8", "⅜": "3/8", "⅝": "5/8", "⅞": "7/8",
};
const UNIT_ALIASES = {
  cups: "cup", cup: "cup", c: "cup",
  tablespoons: "tbsp", tablespoon: "tbsp", tbsp: "tbsp", tbsps: "tbsp",
  teaspoons: "tsp", teaspoon: "tsp", tsp: "tsp", tsps: "tsp",
  ounces: "oz", ounce: "oz", oz: "oz",
  pounds: "lb", pound: "lb", lbs: "lb", lb: "lb",
  grams: "g", gram: "g", g: "g",
  kilograms: "kg", kilogram: "kg", kg: "kg",
  milliliters: "ml", milliliter: "ml", ml: "ml",
  liters: "l", liter: "l", l: "l",
  cloves: "clove", clove: "clove",
  cans: "can", can: "can",
  pinches: "pinch", pinch: "pinch",
  whole: "whole",
};
const UNIT_REGEX = new RegExp("^(" + Object.keys(UNIT_ALIASES).sort((a, b) => b.length - a.length).join("|") + ")\\b\\.?", "i");

function decodeHtmlEntities(str) {
  const el = document.createElement("textarea");
  el.innerHTML = str;
  return el.value;
}

function parseIngredientLine(rawLine) {
  let line = String(rawLine || "").trim().replace(/^[•\-*–\u2022]\s*/, "");
  Object.entries(FRACTION_MAP).forEach(([sym, frac]) => {
    line = line.split(sym).join(" " + frac + " ");
  });
  line = line.replace(/\s+/g, " ").trim();

  let qty = "";
  const qtyMatch = line.match(/^(\d+\s+\d+\/\d+|\d+\/\d+|\d+(\.\d+)?)/);
  let rest = line;
  if (qtyMatch) {
    qty = qtyMatch[0].trim();
    rest = line.slice(qtyMatch[0].length).trim();
  }

  let unit = "";
  const unitMatch = rest.match(UNIT_REGEX);
  if (unitMatch) {
    unit = UNIT_ALIASES[unitMatch[1].toLowerCase()] || "";
    rest = rest.slice(unitMatch[0].length).trim().replace(/^of\s+/i, "");
  }

  return { qty, unit, name: rest };
}

function parseIngredientText(text) {
  return text
    .split("\n")
    .map((l) => l.trim())
    .filter(Boolean)
    .map(parseIngredientLine);
}

function guessCategory(name) {
  const n = (name || "").toLowerCase();
  const rules = [
    [/chicken|beef|pork|turkey|bacon|sausage|shrimp|salmon|fish|steak|lamb|ham\b/, "Meat & seafood"],
    [/milk|cheese|butter|\begg|eggs\b|yogurt|cream/, "Dairy & eggs"],
    [/onion|garlic|tomato|pepper|lettuce|carrot|potato|lemon|lime|spinach|basil|cilantro|parsley|herb|cucumber|zucchini|mushroom|avocado|apple|banana|celery|ginger/, "Produce"],
    [/flour|sugar|salt|\boil\b|rice|pasta|broth|stock|vinegar|beans|lentil|honey|syrup|baking (soda|powder)/, "Pantry"],
    [/bread|bun|tortilla|bagel|roll\b/, "Bakery"],
    [/cinnamon|cumin|paprika|oregano|thyme|chili flakes|spice|vanilla|nutmeg|clove\b/, "Spices & condiments"],
    [/wine|beer|juice|soda|sparkling water/, "Beverages"],
  ];
  for (const [re, cat] of rules) {
    if (re.test(n)) return cat;
  }
  return "Other";
}

function extractJsonLdRecipe(html) {
  const scriptRegex = /<script[^>]+type=["']application\/ld\+json["'][^>]*>([\s\S]*?)<\/script>/gi;
  const roots = [];
  let m;
  while ((m = scriptRegex.exec(html))) {
    try {
      roots.push(JSON.parse(m[1].trim()));
    } catch (e) {
      // some pages emit slightly malformed JSON-LD - skip it
    }
  }
  function* walk(node) {
    if (Array.isArray(node)) {
      for (const n of node) yield* walk(n);
    } else if (node && typeof node === "object") {
      yield node;
      if (node["@graph"]) yield* walk(node["@graph"]);
    }
  }
  for (const root of roots) {
    for (const node of walk(root)) {
      const type = node["@type"];
      const isRecipe = type === "Recipe" || (Array.isArray(type) && type.includes("Recipe"));
      if (isRecipe) return node;
    }
  }
  return null;
}

function jsonLdToRecipeDraft(node) {
  const name = decodeHtmlEntities(String(node.name || "")).trim();
  let servings = "";
  if (node.recipeYield) {
    const y = Array.isArray(node.recipeYield) ? node.recipeYield[0] : node.recipeYield;
    const found = String(y).match(/\d+/);
    if (found) servings = found[0];
  }
  let instructionsText = "";
  if (Array.isArray(node.recipeInstructions)) {
    instructionsText = node.recipeInstructions
      .map((step) => {
        if (typeof step === "string") return step;
        if (step && step.text) return step.text;
        if (step && Array.isArray(step.itemListElement)) {
          return step.itemListElement.map((s) => (typeof s === "string" ? s : s.text || "")).join("\n");
        }
        return "";
      })
      .filter(Boolean)
      .map(decodeHtmlEntities)
      .join("\n");
  } else if (typeof node.recipeInstructions === "string") {
    instructionsText = decodeHtmlEntities(node.recipeInstructions);
  }
  const rawIngredients = Array.isArray(node.recipeIngredient)
    ? node.recipeIngredient
    : Array.isArray(node.ingredients)
    ? node.ingredients
    : [];
  const ingredients = rawIngredients.map((line) => parseIngredientLine(decodeHtmlEntities(String(line))));
  return { name, servings, instructions: instructionsText.trim(), ingredients };
}

const CORS_PROXIES = [
  { name: "codetabs", build: (url) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}` },
  { name: "allorigins", build: (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}` },
  { name: "cors.lol", build: (url) => `https://api.cors.lol/url=${encodeURIComponent(url)}` },
];
async function fetchHtmlViaProxy(url) {
  const attempts = [];
  for (const proxy of CORS_PROXIES) {
    try {
      const res = await fetch(proxy.build(url));
      if (!res.ok) {
        attempts.push(`${proxy.name}: HTTP ${res.status}`);
        continue;
      }
      const text = await res.text();
      if (text && text.length > 200) return text;
      attempts.push(`${proxy.name}: empty response`);
    } catch (e) {
      attempts.push(`${proxy.name}: ${e.message || "network error"}`);
    }
  }
  const err = new Error("fetch-failed");
  err.detail = attempts.join(" | ");
  throw err;
}
async function importRecipeFromUrl(url) {
  const html = await fetchHtmlViaProxy(url);
  const node = extractJsonLdRecipe(html);
  if (!node) {
    const err = new Error("no-recipe-data");
    throw err;
  }
  return jsonLdToRecipeDraft(node);
}

// ---------- Recipe Form ----------
function RecipeForm({ initial, onSave, onCancel, folders, onManageFolders }) {
  const [name, setName] = useState(initial?.name || "");
  const [servings, setServings] = useState(initial?.servings || 4);
  const [folderId, setFolderId] = useState(initial?.folderId || "");
  const [instructions, setInstructions] = useState(initial?.instructions || "");
  const [ingredients, setIngredients] = useState(
    initial?.ingredients?.length ? initial.ingredients : [{ id: uid(), name: "", qty: "", unit: "", category: "Other" }]
  );
  const [error, setError] = useState("");
  const [importUrl, setImportUrl] = useState("");
  const [importState, setImportState] = useState({ status: "idle", message: "" });
  const [showPaste, setShowPaste] = useState(false);
  const [pasteText, setPasteText] = useState("");

  async function handleFetchUrl() {
    if (!importUrl.trim()) return;
    setImportState({ status: "loading", message: "Fetching recipe…" });
    try {
      const draft = await importRecipeFromUrl(importUrl.trim());
      if (draft.name) setName(draft.name);
      if (draft.servings) setServings(draft.servings);
      if (draft.instructions) setInstructions(draft.instructions);
      if (draft.ingredients.length) {
        setIngredients(
          draft.ingredients.map((i) => ({ id: uid(), name: i.name, qty: i.qty, unit: i.unit, category: guessCategory(i.name) }))
        );
      }
      setImportState({
        status: "success",
        message: `Imported ${draft.ingredients.length} ingredients — double-check quantities and units before saving.`,
      });
    } catch (e) {
      console.error("Recipe import failed:", e, e.detail || "");
      let message;
      if (e.message === "no-recipe-data") {
        message = "Fetched that page, but couldn't find recipe data on it. This site may not publish it in a readable format. Try pasting the ingredients below instead.";
      } else if (e.message === "fetch-failed") {
        message = "Couldn't reach that page right now (the fetch service may be down or blocked). Try again in a moment, or paste the ingredients below instead.";
      } else {
        message = "Couldn't import automatically from that link. Try pasting the ingredients below instead.";
      }
      setImportState({ status: "error", message });
    }
  }

  function handlePasteParse() {
    const parsed = parseIngredientText(pasteText).map((p) => ({
      id: uid(),
      name: p.name,
      qty: p.qty,
      unit: p.unit,
      category: guessCategory(p.name),
    }));
    if (!parsed.length) return;
    setIngredients((prev) => {
      const isBlankDefault = prev.length === 1 && !prev[0].name;
      return isBlankDefault ? parsed : [...prev, ...parsed];
    });
    setPasteText("");
    setShowPaste(false);
  }

  function updateIng(id, field, value) {
    setIngredients((prev) => prev.map((ing) => (ing.id === id ? { ...ing, [field]: value } : ing)));
  }
  function addIng() {
    setIngredients((prev) => [...prev, { id: uid(), name: "", qty: "", unit: "", category: "Other" }]);
  }
  function removeIng(id) {
    setIngredients((prev) => prev.filter((ing) => ing.id !== id));
  }

  function handleSave() {
    if (!name.trim()) {
      setError("Give the recipe a name first.");
      return;
    }
    const cleanIngredients = ingredients
      .map((i) => ({ ...i, name: i.name.trim() }))
      .filter((i) => i.name);
    if (cleanIngredients.length === 0) {
      setError("Add at least one ingredient.");
      return;
    }
    onSave({
      id: initial?.id || uid(),
      name: name.trim(),
      servings: Number(servings) || 1,
      folderId: folderId || null,
      instructions: instructions.trim(),
      ingredients: cleanIngredients,
    });
  }

  const labelStyle = { fontSize: 13, fontWeight: 500, color: C.inkSoft, marginBottom: 5, display: "block" };
  const inputStyle = {
    fontFamily: sans,
    fontSize: 15,
    padding: "9px 10px",
    borderRadius: 7,
    border: `1px solid ${C.line}`,
    background: "#fff",

    boxSizing: "border-box",

  return (

        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>

          <button onClick={onCancel} style={{ background: "none", border: "none", cursor: "pointer", padding: 4 }}>
            <IconX color={C.inkSoft} />
          </button>
        </div>

        <div

            background: C.paperDim,
            borderRadius: 12,
            padding: 12,
            marginBottom: 16,
          }}

          <p style={{ fontSize: 12.5, fontWeight: 600, color: C.herbDeep, textTransform: "uppercase", letterSpacing: 0.4, margin: "0 0 8px" }}>

          <div style={{ display: "flex", gap: 6 }}>
            <input
              style={{ ...inputStyle, flex: 1, minWidth: 0, background: "#fff" }}

            <Btn

          </div>
          {importState.message && (

  );
}

function MealPlanner() {
  const [tab, setTab] = useState("recipes");
  const [recipes, setRecipes] = useState([]);
  const [calendar, setCalendar] = useState({});
  const [groceryChecked, setGroceryChecked] = useState({});
  const [folders, setFolders] = useState([]);
  const [pantry, setPantry] = useState([]);
  const [loaded, setLoaded] = useState(false);

  const [formOpen, setFormOpen] = useState(false);
  const [editingRecipe, setEditingRecipe] = useState(null);
  const [viewingRecipe, setViewingRecipe] = useState(null);
  const [addToDayTarget, setAddToDayTarget] = useState(null); // { date, mealId }
  const [weekStart, setWeekStart] = useState(getMonday(new Date()));
  const [folderModalOpen, setFolderModalOpen] = useState(false);
  const [pantryInput, setPantryInput] = useState("");

  useEffect(() => {
    (async () => {
      const [rRaw, cRaw, g, f, p] = await Promise.all([
        loadKey("recipes", []),
        loadKey("calendar", {}),
        loadKey("grocery-checked", {}),
        loadKey("folders", []),
        loadKey("pantry", []),
      ]);
      const r = rRaw.map(migrateRecipe);
      const c = {};
      Object.entries(cRaw).forEach(([date, entry]) => {
        c[date] = migrateDayEntry(entry);
      });
      setRecipes(r);
      setCalendar(c);
      setGroceryChecked(g);
      setFolders(f);
      setPantry(p);
      setLoaded(true);
      saveKey("recipes", r);
      saveKey("calendar", c);
    })();
  }, []);

  const persistRecipes = useCallback((next) => {
    setRecipes(next);
    saveKey("recipes", next);
  }, []);
  const persistCalendar = useCallback((next) => {
    setCalendar(next);
    saveKey("calendar", next);
  }, []);
  const persistGrocery = useCallback((next) => {
    setGroceryChecked(next);
    saveKey("grocery-checked", next);
  }, []);
  const persistFolders = useCallback((next) => {
    setFolders(next);
    saveKey("folders", next);
  }, []);
  const persistPantry = useCallback((next) => {
    setPantry(next);
    saveKey("pantry", next);
  }, []);

  function addPantryItem(text) {
    const trimmed = text.trim();
    if (!trimmed) return;
    const parsed = parseIngredientLine(trimmed);
    if (!parsed.name) return;
    const key = parsed.name.toLowerCase();
    const unitKey = (parsed.unit || "").toLowerCase();
    const newQtyNum = parseQty(parsed.qty);
    const existingIdx = pantry.findIndex((p) => p.name.toLowerCase() === key && (p.unit || "").toLowerCase() === unitKey);
    if (existingIdx >= 0) {
      const existing = pantry[existingIdx];
      const existingQtyNum = parseQty(String(existing.qty));
      let mergedQty = existing.qty;
      if (!isNaN(newQtyNum) && !isNaN(existingQtyNum)) mergedQty = existingQtyNum + newQtyNum;
      else if (!isNaN(newQtyNum)) mergedQty = newQtyNum;
      const next = pantry.map((p, i) => (i === existingIdx ? { ...p, qty: mergedQty } : p));
      persistPantry(next);
    } else {
      const item = {
        id: uid(),
        name: parsed.name,
        qty: !isNaN(newQtyNum) ? newQtyNum : "",
        unit: parsed.unit || "",
        category: guessCategory(parsed.name),
      };
      persistPantry([...pantry, item]);
    }
  }
  function adjustPantryQty(id, delta) {
    const next = pantry
      .map((p) => {
        if (p.id !== id) return p;
        const current = isNaN(parseQty(String(p.qty))) ? 0 : parseQty(String(p.qty));
        const updated = current + delta;
        return { ...p, qty: updated };
      })
      .filter((p) => p.id !== id || parseQty(String(p.qty)) > 0);
    persistPantry(next);
  }
  function removePantryItem(id) {
    persistPantry(pantry.filter((p) => p.id !== id));
  }

  function saveFolder(folder) {
    const exists = folders.some((f) => f.id === folder.id);
    const next = exists ? folders.map((f) => (f.id === folder.id ? folder : f)) : [...folders, folder];
    persistFolders(next);
  }
  function deleteFolder(id) {
    persistFolders(folders.filter((f) => f.id !== id));
    persistRecipes(recipes.map((r) => (r.folderId === id ? { ...r, folderId: null } : r)));
  }

  function saveRecipe(recipe) {
    const exists = recipes.some((r) => r.id === recipe.id);
    const next = exists ? recipes.map((r) => (r.id === recipe.id ? recipe : r)) : [...recipes, recipe];
    persistRecipes(next);
    setFormOpen(false);
    setEditingRecipe(null);
  }
  function deleteRecipe(id) {
    persistRecipes(recipes.filter((r) => r.id !== id));
    const nextCal = {};
    Object.entries(calendar).forEach(([date, slots]) => {
      nextCal[date] = {
        breakfast: slots.breakfast.filter((i) => i !== id),
        lunch: slots.lunch.filter((i) => i !== id),
        dinner: slots.dinner.filter((i) => i !== id),
      };
    });
    persistCalendar(nextCal);
  }
  function addToDay(date, mealId, recipeId) {
    const key = toISO(date);
    const existing = calendar[key] || { breakfast: [], lunch: [], dinner: [] };
    const nextEntry = { ...existing, [mealId]: [...existing[mealId], recipeId] };
    persistCalendar({ ...calendar, [key]: nextEntry });
    setAddToDayTarget(null);
  }
  function removeFromDay(dateKey, mealId, index) {
    const existing = calendar[dateKey] || { breakfast: [], lunch: [], dinner: [] };
    const nextEntry = { ...existing, [mealId]: existing[mealId].filter((_, i) => i !== index) };
    persistCalendar({ ...calendar, [dateKey]: nextEntry });
  }
  function togglePantryIngredient(ing) {
    const key = ing.name.toLowerCase();
    const unitKey = (ing.unit || "").toLowerCase();
    const alreadyIn = pantry.some((p) => p.name.toLowerCase() === key && (p.unit || "").toLowerCase() === unitKey);
    if (alreadyIn) {
      persistPantry(pantry.filter((p) => !(p.name.toLowerCase() === key && (p.unit || "").toLowerCase() === unitKey)));
      return;
    }
    const qtyNum = parseQty(ing.qty);
    const item = {
      id: uid(),
      name: ing.name,
      qty: !isNaN(qtyNum) ? qtyNum : "",
      unit: ing.unit || "",
      category: ing.category || guessCategory(ing.name),
    };
    persistPantry([...pantry, item]);
  }

  const recipesById = useMemo(() => Object.fromEntries(recipes.map((r) => [r.id, r])), [recipes]);
  const recipeGroups = useMemo(() => groupByFolder(recipes, folders), [recipes, folders]);
  const weekDates = useMemo(() => Array.from({ length: 7 }, (_, i) => addDays(weekStart, i)), [weekStart]);

  const pantryByName = useMemo(() => {
    const map = {};
    pantry.forEach((p) => {
      const key = p.name.trim().toLowerCase();
      if (!map[key]) map[key] = [];
      map[key].push(p);
    });
    return map;
  }, [pantry]);

  const pantryGroups = useMemo(() => {
    const groups = {};
    pantry.forEach((item) => {
      const cat = item.category || "Other";
      if (!groups[cat]) groups[cat] = [];
      groups[cat].push(item);
    });
    Object.values(groups).forEach((list) => list.sort((a, b) => a.name.localeCompare(b.name)));
    return CATEGORIES.map((cat) => ({ cat, items: groups[cat] || [] })).filter((g) => g.items.length > 0);
  }, [pantry]);

  const groceryList = useMemo(() => {
    const totals = {};
    weekDates.forEach((d) => {
      const entry = calendar[toISO(d)] || { breakfast: [], lunch: [], dinner: [] };
      const ids = [...entry.breakfast, ...entry.lunch, ...entry.dinner];
      ids.forEach((id) => {
        const recipe = recipesById[id];
        if (!recipe) return;
        recipe.ingredients.forEach((ing) => {
          const key = `${ing.name.toLowerCase()}|${ing.unit}`;
          if (!totals[key]) {
            totals[key] = { name: ing.name, unit: ing.unit, qty: 0, hasQty: false, category: ing.category || "Other" };
          }
          const n = parseQty(ing.qty);
          if (!isNaN(n)) {
            totals[key].qty += n;
            totals[key].hasQty = true;
          }
        });
      });
    });

    // subtract what's already in the pantry
    Object.keys(totals).forEach((key) => {
      const item = totals[key];
      const pantryMatches = pantryByName[item.name.trim().toLowerCase()];
      if (!pantryMatches || pantryMatches.length === 0) return;
      const sameUnit = pantryMatches.find((p) => (p.unit || "").toLowerCase() === (item.unit || "").toLowerCase() && !isNaN(parseQty(String(p.qty))));
      if (sameUnit && item.hasQty) {
        const remainder = item.qty - parseQty(String(sameUnit.qty));
        if (remainder <= 0.001) {
          delete totals[key];
        } else {
          item.qty = remainder;
          item.pantryAdjusted = true;
        }
        return;
      }
      const presenceOnly = pantryMatches.some((p) => isNaN(parseQty(String(p.qty))));
      if (presenceOnly) {
        delete totals[key];
      }
    });

    return Object.entries(totals)
      .map(([key, v]) => ({ key, ...v }))
      .sort((a, b) => a.name.localeCompare(b.name));
  }, [calendar, weekDates, recipesById, pantryByName]);

  const groupedGrocery = useMemo(() => {
    const groups = {};
    groceryList.forEach((item) => {
      const cat = item.category || "Other";
      if (!groups[cat]) groups[cat] = [];
      groups[cat].push(item);
    });
    return CATEGORIES.map((cat) => ({ cat, items: groups[cat] || [] })).filter((g) => g.items.length > 0);
  }, [groceryList]);

  const weekKey = toISO(weekStart);

  if (!loaded) {
    return <div style={{ padding: 40, textAlign: "center", color: C.inkSoft, fontFamily: sans }}>Loading your kitchen…</div>;
  }

  const tabs = [
    { id: "recipes", label: "Recipes", icon: IconBook },
    { id: "menu", label: "Menu", icon: IconMenuList },
    { id: "calendar", label: "Calendar", icon: IconCalendar },
    { id: "grocery", label: "Grocery", icon: IconCart },
    { id: "pantry", label: "Pantry", icon: IconPantry },
  ];

  return (
    <div style={{ background: C.paper, minHeight: 500, fontFamily: sans, maxWidth: 480, margin: "0 auto", position: "relative", paddingBottom: 64 }}>
      <div
        style={{
          position: "relative",
          background: C.bearFur,
          paddingTop: 28,
          paddingBottom: 40,
          boxShadow: "0 4px 16px rgba(74,54,38,0.14)",
        }}
      >
        <h1
          style={{
            fontFamily: serif,
            fontSize: 23,
            fontWeight: 700,
            letterSpacing: 0.2,
            color: "#FFFFFF",
            margin: 0,
            textAlign: "center",
          }}
        >
          Trinh's Planner
        </h1>
        <div style={{ display: "flex", justifyContent: "center", marginTop: 10 }}>
          <div
            style={{
              width: 112,
              height: 112,
              borderRadius: "50%",
              background: C.paper,
              display: "flex",
              alignItems: "center",
              justifyContent: "center",
              boxShadow: "0 6px 16px rgba(74,54,38,0.18)",
            }}
          >
            <BearIllustration width={90} />
          </div>
        </div>
      </div>

      <div style={{ padding: "14px 16px 20px" }}>
        {tab === "recipes" && (
          <div>
            <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
              <Btn variant="primary" onClick={() => { setEditingRecipe(null); setFormOpen(true); }}>
                <IconPlus size={16} color="#fff" /> New recipe
              </Btn>
              <Btn variant="ghost" onClick={() => setFolderModalOpen(true)}>
                Folders
              </Btn>
            </div>
            {recipes.length === 0 ? (
              <EmptyState text="No recipes yet. Add your first one to start building your menu." />
            ) : folders.length === 0 ? (
              recipes.map((r) => (
                <RecipeCard
                  key={r.id}
                  recipe={r}
                  onEdit={(rec) => { setEditingRecipe(rec); setFormOpen(true); }}
                  onDelete={deleteRecipe}
                  onOpen={setViewingRecipe}
                />
              ))
            ) : (
              recipeGroups.map((group) => (
                <div key={group.folder ? group.folder.id : "unfiled"} style={{ marginBottom: 18 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 7, marginBottom: 8 }}>
                    <span style={{ width: 11, height: 11, borderRadius: "50%", background: group.folder ? group.folder.color : C.line, flexShrink: 0 }} />
                    <h4 style={{ fontFamily: sans, fontSize: 12.5, fontWeight: 600, color: C.herbDeep, textTransform: "uppercase", letterSpacing: 0.4, margin: 0 }}>
                      {group.folder ? group.folder.name : "Unfiled"}
                    </h4>
                  </div>
                  {group.recipes.length === 0 ? (
                    <p style={{ fontSize: 13, color: C.inkSoft, margin: "0 0 4px" }}>No recipes in this folder yet.</p>
                  ) : (
                    group.recipes.map((r) => (
                      <RecipeCard
                        key={r.id}
                        recipe={r}
                        onEdit={(rec) => { setEditingRecipe(rec); setFormOpen(true); }}
                        onDelete={deleteRecipe}
                        onOpen={setViewingRecipe}
                        folderColor={group.folder ? group.folder.color : null}
                      />
                    ))
                  )}
                </div>
              ))
            )}
          </div>
        )}

        {tab === "menu" && (
          <div>
            <p style={{ fontSize: 13.5, color: C.inkSoft, marginTop: 0, marginBottom: 10 }}>
              All of your recipes are ready to schedule — tap one on the Calendar tab to add it to a day.
            </p>
            <Btn variant="ghost" onClick={() => setFolderModalOpen(true)} style={{ marginBottom: 14 }}>
              Folders
            </Btn>
            {recipes.length === 0 ? (
              <EmptyState text="No recipes yet. Add one from the Recipes tab to get started." />
            ) : folders.length === 0 ? (
              recipes.map((r) => (
                <RecipeCard
                  key={r.id}
                  recipe={r}
                  onEdit={(rec) => { setEditingRecipe(rec); setFormOpen(true); }}
                  onDelete={deleteRecipe}
                  onOpen={setViewingRecipe}
                />
              ))
            ) : (
              recipeGroups.map((group) => (
                <div key={group.folder ? group.folder.id : "unfiled"} style={{ marginBottom: 18 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 7, marginBottom: 8 }}>
                    <span style={{ width: 11, height: 11, borderRadius: "50%", background: group.folder ? group.folder.color : C.line, flexShrink: 0 }} />
                    <h4 style={{ fontFamily: sans, fontSize: 12.5, fontWeight: 600, color: C.herbDeep, textTransform: "uppercase", letterSpacing: 0.4, margin: 0 }}>
                      {group.folder ? group.folder.name : "Unfiled"}
                    </h4>
                  </div>
                  {group.recipes.length === 0 ? (
                    <p style={{ fontSize: 13, color: C.inkSoft, margin: "0 0 4px" }}>No recipes in this folder yet.</p>
                  ) : (
                    group.recipes.map((r) => (
                      <RecipeCard
                        key={r.id}
                        recipe={r}
                        onEdit={(rec) => { setEditingRecipe(rec); setFormOpen(true); }}
                        onDelete={deleteRecipe}
                        onOpen={setViewingRecipe}
                        folderColor={group.folder ? group.folder.color : null}
                      />
                    ))
                  )}
                </div>
              ))
            )}
          </div>
        )}

        {tab === "calendar" && (
          <div>
            <WeekNav weekStart={weekStart} setWeekStart={setWeekStart} />
            {weekDates.map((d) => {
              const key = toISO(d);
              const entry = calendar[key] || { breakfast: [], lunch: [], dinner: [] };
              return (
                <div key={key} style={{ marginBottom: 12, background: C.card, boxShadow: "0 1px 3px rgba(74,54,38,0.08)", borderRadius: 14, padding: "12px 14px" }}>
                  <div style={{ marginBottom: 6 }}>
                    <span style={{ fontFamily: serif, fontSize: 15.5, fontWeight: 600, color: C.ink }}>{fmtDay(d)}</span>
                    <span style={{ fontSize: 12.5, color: C.inkSoft, marginLeft: 6 }}>{fmtDate(d)}</span>
                  </div>
                  {MEALS.map((meal) => {
                    const ids = entry[meal.id] || [];
                    return (
                      <div key={meal.id} style={{ padding: "8px 0", borderTop: `1px solid ${C.paperDim}` }}>
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: ids.length ? 6 : 0 }}>
                          <span style={{ fontSize: 12.5, fontWeight: 600, color: C.inkSoft, textTransform: "uppercase", letterSpacing: 0.3 }}>
                            {meal.label}
                          </span>
                          <button
                            onClick={() => setAddToDayTarget({ date: d, mealId: meal.id })}
                            style={{ background: C.paperDim, border: "none", borderRadius: 999, cursor: "pointer", padding: "4px 9px", display: "flex", alignItems: "center", gap: 4, fontSize: 12, color: C.herbDeep, fontFamily: sans }}
                          >
                            <IconPlus size={12} color={C.herbDeep} /> Add
                          </button>
                        </div>
                        {ids.length > 0 && (
                          <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                            {ids.map((id, idx) => {
                              const r = recipesById[id];
                              if (!r) return null;
                              return (
                                <span
                                  key={idx}
                                  style={{ background: C.paperDim, borderRadius: 20, padding: "5px 10px", fontSize: 13, color: C.ink, display: "flex", alignItems: "center", gap: 6 }}
                                >
                                  {r.name}
                                  <button onClick={() => removeFromDay(key, meal.id, idx)} style={{ background: "none", border: "none", cursor: "pointer", padding: 0, lineHeight: 0 }} aria-label="Remove">
                                    <IconX size={13} color={C.inkSoft} />
                                  </button>
                                </span>
                              );
                            })}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              );
            })}
          </div>
        )}

        {tab === "grocery" && (
          <div>
            <WeekNav weekStart={weekStart} setWeekStart={setWeekStart} />
            <p style={{ fontSize: 13, color: C.inkSoft, margin: "0 0 14px" }}>
              Everything needed for the week of {fmtDate(weekStart)} – {fmtDate(addDays(weekStart, 6))}, minus what's already in your pantry.
            </p>
            {groupedGrocery.length === 0 ? (
              <EmptyState text="Nothing left to buy — either nothing's planned for this week, or your pantry already covers it." />
            ) : (
              groupedGrocery.map((group) => (
                <div key={group.cat} style={{ marginBottom: 16 }}>
                  <h4 style={{ fontFamily: sans, fontSize: 12.5, fontWeight: 600, color: C.herbDeep, textTransform: "uppercase", letterSpacing: 0.4, margin: "0 0 6px" }}>
                    {group.cat}
                  </h4>
                  <div style={{ background: C.card, boxShadow: "0 1px 3px rgba(74,54,38,0.08)", borderRadius: 14, overflow: "hidden" }}>
                    {group.items.map((item, idx) => {
                      const checkKey = `${weekKey}::${item.key}`;
                      const checked = !!groceryChecked[checkKey];
                      return (
                        <div
                          key={item.key}
                          onClick={() => persistGrocery({ ...groceryChecked, [checkKey]: !checked })}
                          style={{
                            display: "flex",
                            alignItems: "center",
                            gap: 10,
                            padding: "11px 13px",
                            borderBottom: idx < group.items.length - 1 ? `1px solid ${C.paperDim}` : "none",
                            cursor: "pointer",
                          }}
                        >
                          <div
                            style={{
                              width: 20,
                              height: 20,
                              borderRadius: 5,
                              border: `1.5px solid ${checked ? C.herb : C.line}`,
                              background: checked ? C.herb : "transparent",
                              display: "flex",
                              alignItems: "center",
                              justifyContent: "center",
                              flexShrink: 0,
                            }}
                          >
                            {checked && <IconCheck size={13} color="#fff" />}
                          </div>
                          <span style={{ fontSize: 14.5, color: checked ? C.inkSoft : C.ink, textDecoration: checked ? "line-through" : "none" }}>
                            {item.hasQty ? `${formatQty(item.qty)} ${item.unit} ` : ""}
                            {item.name}
                            {item.pantryAdjusted && (
                              <span style={{ fontSize: 12, color: C.inkSoft, fontStyle: "italic" }}> · have some in pantry</span>
                            )}
                          </span>
                        </div>
                      );
                    })}
                  </div>
                </div>
              ))
            )}
          </div>
        )}

        {tab === "pantry" && (
          <div>
            <p style={{ fontSize: 13.5, color: C.inkSoft, marginTop: 0, marginBottom: 12 }}>
              What you already have on hand. Anything listed here gets subtracted from your weekly grocery list.
            </p>
            <div style={{ display: "flex", gap: 6, marginBottom: 16 }}>
              <input
                style={{
                  flex: 1,
                  minWidth: 0,
                  fontFamily: sans,
                  fontSize: 15,
                  padding: "10px 12px",
                  borderRadius: 10,
                  border: `1px solid ${C.line}`,
                  background: "#fff",
                  color: C.ink,
                  boxSizing: "border-box",
                }}
                placeholder="e.g. 2 cups flour, or just olive oil"
                value={pantryInput}
                onChange={(e) => setPantryInput(e.target.value)}
                onKeyDown={(e) => {
                  if (e.key === "Enter") {
                    addPantryItem(pantryInput);
                    setPantryInput("");
                  }
                }}
              />
              <Btn
                variant="primary"
                onClick={() => {
                  addPantryItem(pantryInput);
                  setPantryInput("");
                }}
              >
                Add
              </Btn>
            </div>

            {pantry.length === 0 ? (
              <EmptyState text="Your pantry is empty. Add staples you already have so they're skipped on your grocery list." />
            ) : (
              pantryGroups.map((group) => (
                <div key={group.cat} style={{ marginBottom: 16 }}>
                  <h4 style={{ fontFamily: sans, fontSize: 12.5, fontWeight: 600, color: C.herbDeep, textTransform: "uppercase", letterSpacing: 0.4, margin: "0 0 6px" }}>
                    {group.cat}
                  </h4>
                  <div style={{ background: C.card, boxShadow: "0 1px 3px rgba(74,54,38,0.08)", borderRadius: 14, overflow: "hidden" }}>
                    {group.items.map((item, idx) => {
                      const qtyNum = parseQty(String(item.qty));
                      const hasQty = !isNaN(qtyNum) && String(item.qty).trim() !== "";
                      return (
                        <div
                          key={item.id}
                          style={{
                            display: "flex",
                            alignItems: "center",
                            gap: 10,
                            padding: "10px 13px",
                            borderBottom: idx < group.items.length - 1 ? `1px solid ${C.paperDim}` : "none",
                          }}
                        >
                          <span style={{ fontSize: 14.5, color: C.ink, flex: 1, minWidth: 0 }}>
                            {item.name}
                            {!hasQty && <span style={{ fontSize: 12, color: C.inkSoft, marginLeft: 6 }}>in stock</span>}
                          </span>
                          {hasQty && (
                            <button
                              onClick={() => adjustPantryQty(item.id, -1)}
                              aria-label="Decrease"
                              style={{ width: 26, height: 26, borderRadius: "50%", background: C.paperDim, border: "none", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}
                            >
                              <IconMinus size={14} color={C.herbDeep} />
                            </button>
                          )}
                          {hasQty && (
                            <span style={{ fontSize: 13.5, color: C.ink, minWidth: 44, textAlign: "center", flexShrink: 0 }}>
                              {formatQty(qtyNum)} {item.unit}
                            </span>
                          )}
                          <button
                            onClick={() => adjustPantryQty(item.id, 1)}
                            aria-label="Increase"
                            style={{ width: 26, height: 26, borderRadius: "50%", background: C.paperDim, border: "none", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}
                          >
                            <IconPlus size={14} color={C.herbDeep} />
                          </button>
                          <button
                            onClick={() => removePantryItem(item.id)}
                            aria-label="Remove from pantry"
                            style={{ background: "none", border: "none", cursor: "pointer", padding: 4, flexShrink: 0 }}
                          >
                            <IconTrash color={C.tomatoDeep} />
                          </button>
                        </div>
                      );
                    })}
                  </div>
                </div>
              ))
            )}
          </div>
        )}
      </div>

      {formOpen && (
        <RecipeForm
          initial={editingRecipe}
          onSave={saveRecipe}
          onCancel={() => { setFormOpen(false); setEditingRecipe(null); }}
          folders={folders}
          onManageFolders={() => setFolderModalOpen(true)}
        />
      )}
      {viewingRecipe && (
        <RecipeDetail
          recipe={viewingRecipe}
          onClose={() => setViewingRecipe(null)}
          pantry={pantry}
          onTogglePantry={togglePantryIngredient}
        />
      )}
      {folderModalOpen && (
        <FolderModal
          folders={folders}
          onSave={saveFolder}
          onDelete={deleteFolder}
          onClose={() => setFolderModalOpen(false)}
        />
      )}
      {addToDayTarget && (
        <AddToDayModal
          date={addToDayTarget.date}
          mealId={addToDayTarget.mealId}
          availableRecipes={recipes.slice().sort((a, b) => a.name.localeCompare(b.name))}
          onAdd={(id) => addToDay(addToDayTarget.date, addToDayTarget.mealId, id)}
          onClose={() => setAddToDayTarget(null)}
        />
      )}

      <div
        style={{
          position: "fixed",
          bottom: 0,
          left: "50%",
          transform: "translateX(-50%)",
          width: "100%",
          maxWidth: 480,
          background: C.card,
          boxShadow: "0 -2px 12px rgba(74,54,38,0.1)",
          display: "flex",
          padding: "8px 4px 10px",
        }}
      >
        {tabs.map((t) => {
          const Icon = t.icon;
          const active = tab === t.id;
          return (
            <button
              key={t.id}
              onClick={() => setTab(t.id)}
              style={{
                flex: 1,
                background: "none",
                border: "none",
                cursor: "pointer",
                display: "flex",
                flexDirection: "column",
                alignItems: "center",
                gap: 4,
                padding: "4px 0",
              }}
            >
              <div
                style={{
                  width: 44,
                  height: 26,
                  borderRadius: 999,
                  background: active ? C.paperDim : "transparent",
                  display: "flex",
                  alignItems: "center",
                  justifyContent: "center",
                }}
              >
                <Icon size={20} color={active ? C.herbDeep : C.inkSoft} />
              </div>
              <span style={{ fontSize: 11, fontFamily: sans, color: active ? C.herbDeep : C.inkSoft, fontWeight: active ? 600 : 400 }}>
                {t.label}
              </span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

function WeekNav({ weekStart, setWeekStart }) {
  return (
    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 14 }}>
      <button onClick={() => setWeekStart(addDays(weekStart, -7))} style={navBtnStyle}>
        ‹
      </button>
      <span style={{ fontFamily: serif, fontSize: 15, fontWeight: 600, color: C.ink }}>
        {fmtDate(weekStart)} – {fmtDate(addDays(weekStart, 6))}
      </span>
      <button onClick={() => setWeekStart(addDays(weekStart, 7))} style={navBtnStyle}>
        ›
      </button>
    </div>
  );
}
const navBtnStyle = {
  background: C.card,
  border: "none",
  boxShadow: "0 1px 3px rgba(74,54,38,0.1)",
  borderRadius: "50%",
  width: 34,
  height: 34,
  cursor: "pointer",
  fontSize: 18,
  color: C.ink,
  lineHeight: 1,
};

function EmptyState({ text }) {
  return (
    <div style={{ textAlign: "center", padding: "36px 16px", color: C.inkSoft, fontSize: 14, border: `1px dashed ${C.line}`, borderRadius: 12 }}>
      {text}
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<MealPlanner />);
</script>
</body>
</html>
